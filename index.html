<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OCI Architect Associate 総合学習アプリ</title>
  <style>
    :root {
      --bg: #f4f6f9;
      --card: #ffffff;
      --text: #333333;
      --primary: #0076d6;
      --success: #2e7d32;
      --error: #c62828;
      --border: #e0e0e0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 12px;
      display: flex;
      justify-content: center;
    }
    .container {
      width: 100%;
      max-width: 600px;
      background: var(--card);
      border-radius: 12px;
      padding: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      box-sizing: border-box;
    }
    /* タブナビゲーション */
    .tab-nav {
      display: flex;
      gap: 6px;
      margin-bottom: 16px;
      border-bottom: 2px solid var(--border);
      padding-bottom: 8px;
    }
    .tab-btn {
      flex: 1;
      padding: 8px 4px;
      border: none;
      background: #e0e0e0;
      border-radius: 6px;
      font-size: 13px;
      font-weight: bold;
      color: #555;
      cursor: pointer;
    }
    .tab-btn.active {
      background: var(--primary);
      color: #fff;
    }
    .tab-content {
      display: none;
    }
    .tab-content.active {
      display: block;
    }

    /* 共通要素 */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      font-size: 14px;
      font-weight: bold;
      color: #666;
    }
    .q-text {
      font-size: 15px;
      line-height: 1.5;
      margin-bottom: 16px;
      white-space: pre-wrap;
    }
    .options {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .option-btn {
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #fff;
      text-align: left;
      font-size: 14px;
      line-height: 1.4;
      cursor: pointer;
    }
    .option-btn.selected {
      border-color: var(--primary);
      background: #e3f2fd;
    }
    .option-btn.correct-show {
      background: #e8f5e9;
      border-color: var(--success);
      color: var(--success);
      font-weight: bold;
    }
    .option-btn.wrong-show {
      background: #ffebee;
      border-color: var(--error);
      color: var(--error);
    }
    .action-btn {
      width: 100%;
      padding: 14px;
      margin-top: 16px;
      border: none;
      border-radius: 8px;
      background: var(--primary);
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }
    .explanation {
      margin-top: 16px;
      padding: 12px;
      background: #f8f9fa;
      border-left: 4px solid var(--primary);
      border-radius: 4px;
      font-size: 13px;
      line-height: 1.6;
      white-space: pre-wrap;
      display: none;
    }
    .option-exp {
      margin-top: 6px;
      font-size: 12px;
      color: #555;
      background: #fff;
      padding: 8px;
      border-radius: 4px;
      border: 1px dashed #ccc;
      display: none;
    }

    /* 用語一覧用スタイル */
    .search-box {
      width: 100%;
      padding: 10px;
      margin-bottom: 12px;
      border: 1px solid var(--border);
      border-radius: 6px;
      box-sizing: border-box;
      font-size: 14px;
    }
    .term-item {
      border: 1px solid var(--border);
      border-radius: 6px;
      margin-bottom: 8px;
      overflow: hidden;
    }
    .term-title {
      padding: 12px;
      background: #f9f9f9;
      font-weight: bold;
      font-size: 14px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
    }
    .term-body {
      padding: 12px;
      font-size: 13px;
      line-height: 1.5;
      display: none;
      background: #fff;
      border-top: 1px solid var(--border);
    }
  </style>
</head>
<body>

<div class="container">
  <!-- タブ切り替えボタン -->
  <div class="tab-nav">
    <button class="tab-btn active" onclick="switchTab('quiz-tab')">実践問題集</button>
    <button class="tab-btn" onclick="switchTab('terms-tab')">用語一覧</button>
    <button class="tab-btn" onclick="switchTab('term-quiz-tab')">用語クイズ</button>
  </div>

  <!-- TAB 1: 実践問題集 -->
  <div id="quiz-tab" class="tab-content active">
    <div class="header">
      <span id="q-count">問題 1 / 20</span>
      <span id="q-req"></span>
    </div>
    <div id="q-text" class="q-text"></div>
    <div id="options" class="options"></div>
    <button id="action-btn" class="action-btn" onclick="submitAnswer()">回答する</button>
    <div id="explanation" class="explanation"></div>
  </div>

  <!-- TAB 2: 用語一覧 -->
  <div id="terms-tab" class="tab-content">
    <input type="text" id="term-search" class="search-box" placeholder="用語を検索..." oninput="filterTerms()">
    <div id="terms-list"></div>
  </div>

  <!-- TAB 3: 用語クイズ -->
  <div id="term-quiz-tab" class="tab-content">
    <div class="header">
      <span id="tq-count">用語クイズ 1 / 10</span>
    </div>
    <div id="tq-text" class="q-text"></div>
    <div id="tq-options" class="options"></div>
    <button id="tq-action-btn" class="action-btn" onclick="submitTermQuizAnswer()">回答する</button>
    <div id="tq-explanation" class="explanation"></div>
  </div>
</div>

<script>
// パスワード機能（必要に応じてパスワードを変更してください）
const MY_PASSWORD = "pass"; 
let inputPass = prompt("パスワードを入力してください:");
if (inputPass !== MY_PASSWORD) {
  alert("パスワードが正しくありません。");
  document.body.innerHTML = "<h2 style='text-align:center; margin-top:50px;'>アクセス権限がありません。</h2>";
  throw new Error("Unauthorized");
}

// --------------------------------------------------
// 専門用語データ（辞書＆クイズ用）
// --------------------------------------------------
const termDictionary = [
  { term: "動的グループ（Dynamic Group）", desc: "OCIリソース（コンピュートやFunctionsなど）を自動でまとめるグループ。IAMポリシーを適用することで、リソース自体に他サービスへのアクセス権限を付与できる。" },
  { term: "サービス・ゲートウェイ", desc: "VCN内のプライベート・サブネットから、インターネットを経由せずにOCIの各種サービス（LoggingやObject Storageなど）へ安全にアクセスするための通信口。" },
  { term: "NAT ゲートウェイ", desc: "プライベート・サブネット内のインスタンスが、インターネット側へ一方通行で通信（アウトバウンド）できるようにするゲートウェイ。" },
  { term: "DRG（動的ルーティング・ゲートウェイ）", desc: "VCNと外部ネットワーク（オンプレミス、他リージョンのVCN、Azureなど）を専用線やVPNで相互接続するための仮想ルーター。" },
  { term: "ジオロケーション・ステアリング", desc: "OCI DNSの機能。アクセス元のユーザーの地理的ロケーションに基づいて、最も近いデータセンターのIPアドレスへ誘導するポリシー。" },
  { term: "WAF（Web Application Firewall）", desc: "Webアプリケーションの手前に配置し、SQLインジェクションやXSSなどの悪意あるリクエストを検知・遮断するセキュリティ機能。" },
  { term: "認証トークン（Auth Token）", desc: "Docker CLIなどの外部ツールからOCI Container Registry（OCIR）へアクセス・ログインする際にパスワードとして使用する文字列。" },
  { term: "ZPR（Zero Trust Packet Routing）", desc: "ネットワークIPアドレスではなく「セキュリティ属性（タグ）」に基づいて通信の許可・不許可を制御するOCIのゼロトラストセキュリティ機能。" },
  { term: "RCV（Autonomous Recovery Service）", desc: "Oracle Database向けの全自動リカバリサービス。ZDLRA技術をベースとし、RPOを1秒未満に抑えるリアルタイム保護を提供する。" },
  { term: "OCI Cache", desc: "RedisおよびValkeyと互換性のあるフルマネージドのインメモリキャッシュサービス。ミリ秒未満の高速レスポンスを実現する。" }
];

// --------------------------------------------------
// 全20問の問題データ
// --------------------------------------------------
const rawQuestions = [
  {
    id: 1, reqCount: 4,
    text: "OCI Functions（ファンクション）に関する記述として正しいものを4つ選んでください。",
    options: [
      { id: "A", text: "実行中のファンクションから他の OCI リソースにアクセスすることは禁止されている。", exp: "【誤】IAMポリシーや動的グループを使えば他リソースへのアクセスが可能です。" },
      { id: "B", text: "ファンクションを動的グループに含め、IAM ポリシーを構成することで、他の OCI リソースへアクセスできる。", exp: "【正】動的グループとポリシーの組み合わせによりアクセス権を付与できます。" },
      { id: "C", text: "ファンクションの呼び出し回数や実行時間などは、OCI モニタリング・サービスでメトリックとして監視できる。", exp: "【正】呼び出し回数や実行時間は標準メトリックです。" },
      { id: "D", text: "モニタリング・サービスで監視できるメトリックとして、ファンクションが消費している CPU やメモリーの量がある。", exp: "【誤】CPUやメモリ消費量のメトリックは直接提供されていません。" },
      { id: "E", text: "サービス・コネクタ・ハブのタスクとしてファンクションを指定し、ログデータを加工できる。", exp: "【正】サービス・コネクタ・ハブのタスクとしてデータ加工に利用可能です。" },
      { id: "F", text: "モニタリングのアラーム定義において、アラーム通知の宛先として直接指定できる。", exp: "【誤】通知の宛先にはトピック（ONS）等を指定します。" },
      { id: "G", text: "リソース・スケジューラを使用して、ファンクションの定期実行を設定できる。", exp: "【正】リソース・スケジューラからの定期実行に対応しています。" }
    ],
    correct: ["B", "C", "E", "G"],
    exp: "【総合解説】ファンクションは動的グループとIAMポリシーで他リソースへアクセスでき、モニタリング監視やサービス・コネクタ連携、リソース・スケジューラからの実行に対応しています。"
  },
  {
    id: 2, reqCount: 2,
    text: "マルチ AD 構成において、AD3 にだけ新しいインスタンスが作成されませんでした。原因として考えられるものを2つ選んでください。",
    options: [
      { id: "A", text: "ロード・バランサのバックエンド・セットで AD3 が除外されているため。", exp: "【誤】ロードバランサの設定はインスタンス作成に影響しません。" },
      { id: "B", text: "インスタンス・プールの「配置構成」で AD3 が選択されていないため。", exp: "【正】配置構成にAD3が含まれていない場合、作成されません。" },
      { id: "C", text: "インスタンス・プールは複数 AD に跨って構成することはできないため。", exp: "【誤】複数ADに跨った構成が可能です。" },
      { id: "D", text: "自動スケーリング・ポリシーの設定で AD3 が明示的に除外されているため。", exp: "【誤】自動スケーリングでAD単位の除外設定は行いません。" },
      { id: "E", text: "インスタンス・プール構成において AD を複数選択することはできないため。", exp: "【誤】複数選択可能です。" },
      { id: "F", text: "当該コンパートメントの AD3 におけるコンピュート・クォータ（またはサービス制限）の上限に達しているため。", exp: "【正】クォータやサービス制限に達しているとエラーになります。" },
      { id: "G", text: "ロード・バランサの負荷分散アルゴリズムが「加重ラウンド・ロビン」に設定されているため。", exp: "【誤】コンピュート作成とは無関係です。" }
    ],
    correct: ["B", "F"],
    exp: "【総合解説】配置構成の設定ミスか、特定ADでのクォータ/サービス制限上限が主な原因です。"
  },
  {
    id: 3, reqCount: 1,
    text: "地理的に最も近いデータセンターへトラフィックを誘導し、障害時には自動的に別データセンターへ切り替える最適なDNS設定を1つ選んでください。",
    options: [
      { id: "A", text: "DNS トラフィック管理で「ジオロケーション・ステアリング・ポリシー」を使用し、ヘルス・チェックをアタッチする。", exp: "【正】「ジオロケーション・ステアリング」と「ヘルス・チェック」の組み合わせが最適です。" },
      { id: "B", text: "DNS トラフィック管理で「ラウンド・ロビン」ポリシーを使用し、ヘルス・チェックをアタッチする。", exp: "【誤】ラウンドロビンは地理的な近接性を考慮しません。" },
      { id: "C", text: "DNS トラフィック管理で「ロード・バランサ」ポリシーを使用し、ヘルス・チェックをアタッチする。", exp: "【誤】位置情報を考慮した誘導には不適切です。" },
      { id: "D", text: "DNS トラフィック管理で「フェイルオーバー」ポリシーを使用し、ヘルス・チェックをアタッチする。", exp: "【誤】フェイルオーバーは地理的近接性ベースではありません。" },
      { id: "E", text: "OCI DNS ゾーンで個別の A レコードを直接定義し、TTL を短く設定する。", exp: "【誤】自動的な障害切替は行えません。" }
    ],
    correct: ["A"],
    exp: "【総合解説】ジオロケーション・ステアリング・ポリシーにヘルス・チェックを組み合わせることで高可用性を担保します。"
  },
  {
    id: 4, reqCount: 2,
    text: "ブロック・ボリュームでスループットが約128 MB/秒で頭打ちになりました。原因と対策として正しいものを2つ選んでください。",
    options: [
      { id: "A", text: "ブロック・ボリュームの VPU 設定を「高パフォーマンス」に引き上げる。", exp: "【誤】接続元インスタンス側の帯域制限を超えなければ改善しません。" },
      { id: "B", text: "ボリュームの暗号化方式を「顧客管理キー」に変更する。", exp: "【誤】暗号化方式はパフォーマンスに直接影響しません。" },
      { id: "C", text: "接続先インスタンスの OCPU 数を「1 OCPU」から「2 OCPU」以上にスケールアップする。", exp: "【正】OCPUを増やすと割り当てられる帯域が拡張されます。" },
      { id: "D", text: "実際のパフォーマンスは、接続されているインスタンスのシェイプ（ネットワーク帯域制限）に依存するため、インスタンス側の帯域を拡張する。", exp: "【正】インスタンス側の帯域を拡張する必要があります。" },
      { id: "E", text: "ボリュームサイズを 500 GB から 1 TB に変更する。", exp: "【誤】サイズ変更単体では帯域制限は解消されません。" },
      { id: "F", text: "アタッチメント・タイプを iSCSI から準仮想化に変更する。", exp: "【誤】パフォーマンス面ではiSCSIアタッチが推奨されます。" }
    ],
    correct: ["C", "D"],
    exp: "【総合解説】低OCPUインスタンスの帯域制限がボトルネックとなるため、OCPU追加等で帯域を拡張します。"
  },
  {
    id: 5, reqCount: 3,
    text: "プライベート・サブネットのインスタンスからモニタリング・サービスへデータを送信するために必要な設定を3つ選んでください。",
    options: [
      { id: "A", text: "プライベート・サブネットのルート表に、すべての OCI サービス宛ての「サービス・ゲートウェイ」を追加する。", exp: "【正】インターネットを経由せずにOCIサービスへ接続する経路です。" },
      { id: "B", text: "インスタンスにパブリック IP アドレスを割り当てる。", exp: "【誤】プライベートサブネットのため不適切です。" },
      { id: "C", text: "プライベート・サブネットのルート表に「NAT ゲートウェイ」宛てのデフォルトルートを追加する。", exp: "【正】通信経路としてNATゲートウェイのルーティングも利用可能です。" },
      { id: "D", text: "Oracle Cloud Agent で「コンピュート・インスタンスのモニタリング」プラグインを有効化する。", exp: "【正】OS側メトリックを送信するために必須です。" },
      { id: "E", text: "Oracle Cloud Agent で「OS 管理ハブ」プラグインを有効化する。", exp: "【誤】OS管理ハブはパッチ管理用です。" }
    ],
    correct: ["A", "C", "D"],
    exp: "【総合解説】サービス/NATゲートウェイによる通信経路確保と、モニタリングプラグインの有効化が必要です。"
  },
  {
    id: 6, reqCount: 3,
    text: "VCN 外（共有領域）の ATP（サーバーレス）に対して、VCN 内から安全に接続するための構成を3つ選んでください。",
    options: [
      { id: "A", text: "ATP の ACL に、プライベート・サブネットの CIDR ブロックを追加する。", exp: "【誤】ATPサーバーレスのACLにプライベートCIDRは指定できません。" },
      { id: "B", text: "ATP の ACL に、パブリック・サブネットのインスタンスのパブリック IP を追加する。", exp: "【正】パブリックIPを持つインスタンスからの接続を許可できます。" },
      { id: "C", text: "ATP の ACL に、NAT ゲートウェイのパブリック IP を追加する。", exp: "【正】NATゲートウェイのパブリックIPをACLに登録します。" },
      { id: "D", text: "ATP が含まれるサブネットのセキュリティ・リストで、ポート 1521 を許可する。", exp: "【誤】ATPはVCN外にあるためセキュリティリストは影響しません。" },
      { id: "E", text: "プライベート・サブネットのルート表に、NAT ゲートウェイ経由のルーティングを設定する。", exp: "【正】NATゲートウェイに向けるルーティング設定が必要です。" },
      { id: "F", text: "プライベート・サブネットのセキュリティ・リストで、ATP の IP 宛てポート 1521 を追加する。", exp: "【誤】ATPはVCN外のため無効です。" }
    ],
    correct: ["B", "C", "E"],
    exp: "【総合解説】NATゲートウェイ経由の経路を設定し、そのパブリックIPをATP側のACLに許可登録します。"
  },
  {
    id: 7, reqCount: 1,
    text: "オンプレミスと OCI 間で、通常時は高速専用線、障害時は安価なバックアップに切り替わるコスト効率に優れた設計を1つ選んでください。",
    options: [
      { id: "A", text: "FastConnect を諦めて IPsec VPN を 2 本で冗長化する。", exp: "【誤】高速専用線のメリットが失われます。" },
      { id: "B", text: "FastConnect 回線を 2 本契約してプライマリ/セカンダリ構成とする。", exp: "【誤】コストが高価になります。" },
      { id: "C", text: "メインに FastConnect、バックアップに IPsec VPN を使用し、1 つの DRG に接続して動的ルーティングを設定する。", exp: "【正】メインにFastConnect、バックアップにIPsec VPNを組むのが最適です。" },
      { id: "D", text: "通常時は IPsec VPN を使用し、障害時に FastConnect へ切り替える。", exp: "【誤】通常時のパフォーマンス要件に反します。" },
      { id: "E", text: "FastConnect 用と IPsec VPN 用にそれぞれ別々の DRG を作成する。", exp: "【誤】1つのDRGに集約します。" }
    ],
    correct: ["C"],
    exp: "【総合解説】FastConnectとIPsec VPNを単一DRGに接続し、動的ルーティングで制御するのがベストです。"
  },
  {
    id: 8, reqCount: 1,
    text: "OCI 上の複数 VCN と Azure 仮想ネットワークを専用線でダイレクト接続し、全 VCN からアクセス可能にする最適な構成を1つ選んでください。",

// タブ切り替え
function switchTab(tabId) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
  
  if(tabId === 'quiz-tab') document.querySelectorAll('.tab-btn')[0].classList.add('active');
  if(tabId === 'terms-tab') document.querySelectorAll('.tab-btn')[1].classList.add('active');
  if(tabId === 'term-quiz-tab') document.querySelectorAll('.tab-btn')[2].classList.add('active');
  
  document.getElementById(tabId).classList.add('active');
}

// 配列シャッフル
function shuffle(array) {
  const arr = [...array];
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

// --- TAB 1: 実践問題集制御 ---
let questions = [];
let currentIdx = 0;
let selectedIds = [];
let isSubmitted = false;

function initQuiz() {
  questions = shuffle(rawQuestions).map(q => ({
    ...q,
    shuffledOptions: shuffle(q.options)
  }));
  currentIdx = 0;
  loadQuestion();
}

function loadQuestion() {
  isSubmitted = false;
  selectedIds = [];
  const q = questions[currentIdx];
  
  document.getElementById('q-count').innerText = `問題 ${currentIdx + 1} / ${questions.length}`;
  document.getElementById('q-req').innerText = `【${q.reqCount}つ選択】`;
  document.getElementById('q-text').innerText = q.text;
  
  const optionsDiv = document.getElementById('options');
  optionsDiv.innerHTML = '';
  
  q.shuffledOptions.forEach((opt, idx) => {
    const wrapper = document.createElement('div');
    wrapper.style.display = 'flex';
    wrapper.style.flexDirection = 'column';
    
    const btn = document.createElement('button');
    btn.className = 'option-btn';
    btn.innerText = opt.text;
    btn.onclick = () => selectOption(opt.id, btn);
    
    const expDiv = document.createElement('div');
    expDiv.className = 'option-exp';
    expDiv.id = `opt-exp-${idx}`;
    expDiv.innerText = opt.exp;
    
    wrapper.appendChild(btn);
    wrapper.appendChild(expDiv);
    optionsDiv.appendChild(wrapper);
  });
  
  document.getElementById('action-btn').innerText = "回答する";
  document.getElementById('explanation').style.display = 'none';
}

function selectOption(id, btn) {
  if (isSubmitted) return;
  const q = questions[currentIdx];
  if (q.reqCount === 1) {
    selectedIds = [id];
    document.querySelectorAll('#options .option-btn').forEach(b => b.classList.remove('selected'));
    btn.classList.add('selected');
  } else {
    if (selectedIds.includes(id)) {
      selectedIds = selectedIds.filter(i => i !== id);
      btn.classList.remove('selected');
    } else if (selectedIds.length < q.reqCount) {
      selectedIds.push(id);
      btn.classList.add('selected');
    }
  }
}

function submitAnswer() {
  const q = questions[currentIdx];
  const btn = document.getElementById('action-btn');
  
  if (!isSubmitted) {
    if (selectedIds.length !== q.reqCount) {
      alert(`${q.reqCount} つの選択肢を選んでください。`);
      return;
    }
    isSubmitted = true;
    const optionBtns = document.querySelectorAll('#options .option-btn');
    
    q.shuffledOptions.forEach((opt, idx) => {
      const isCorrect = q.correct.includes(opt.id);
      const isSelected = selectedIds.includes(opt.id);
      if (isCorrect) optionBtns[idx].classList.add('correct-show');
      else if (isSelected) optionBtns[idx].classList.add('wrong-show');
      document.getElementById(`opt-exp-${idx}`).style.display = 'block';
    });
    
    const expDiv = document.getElementById('explanation');
    expDiv.innerText = q.exp;
    expDiv.style.display = 'block';
    
    btn.innerText = (currentIdx < questions.length - 1) ? "次の問題へ" : "最初からやり直す";
  } else {
    if (currentIdx < questions.length - 1) {
      currentIdx++;
      loadQuestion();
    } else {
      initQuiz();
    }
  }
}

// --- TAB 2: 用語一覧制御 ---
function renderTerms(filter = "") {
  const listDiv = document.getElementById('terms-list');
  listDiv.innerHTML = '';
  
  termDictionary.forEach(item => {
    if (filter && !item.term.toLowerCase().includes(filter.toLowerCase()) && !item.desc.toLowerCase().includes(filter.toLowerCase())) {
      return;
    }
    const itemDiv = document.createElement('div');
    itemDiv.className = 'term-item';
    
    const titleDiv = document.createElement('div');
    titleDiv.className = 'term-title';
    titleDiv.innerHTML = `<span>${item.term}</span><span>▼</span>`;
    
    const bodyDiv = document.createElement('div');
    bodyDiv.className = 'term-body';
    bodyDiv.innerText = item.desc;
    
    titleDiv.onclick = () => {
      const isOpen = bodyDiv.style.display === 'block';
      bodyDiv.style.display = isOpen ? 'none' : 'block';
      titleDiv.querySelector('span:last-child').innerText = isOpen ? '▼' : '▲';
    };
    
    itemDiv.appendChild(titleDiv);
    itemDiv.appendChild(bodyDiv);
    listDiv.appendChild(itemDiv);
  });
}

function filterTerms() {
  const val = document.getElementById('term-search').value;
  renderTerms(val);
}

// --- TAB 3: 用語一問一答クイズ制御 ---
let termQuestions = [];
let tqIdx = 0;
let tqSelectedOption = null;
let tqIsSubmitted = false;

function initTermQuiz() {
  // 辞書データから四択クイズを動的生成
  termQuestions = shuffle(termDictionary).map(target => {
    // 正解以外の用語からランダムに3つ選出
    const dummyOptions = shuffle(termDictionary.filter(t => t.term !== target.term)).slice(0, 3);
    const options = shuffle([
      { term: target.term, isCorrect: true },
      ...dummyOptions.map(d => ({ term: d.term, isCorrect: false }))
    ]);
    return {
      desc: target.desc,
      correctTerm: target.term,
      options: options
    };
  });
  tqIdx = 0;
  loadTermQuestion();
}

function loadTermQuestion() {
  tqIsSubmitted = false;
  tqSelectedOption = null;
  const q = termQuestions[tqIdx];
  
  document.getElementById('tq-count').innerText = `用語クイズ ${tqIdx + 1} / ${termQuestions.length}`;
  document.getElementById('tq-text').innerText = `【説明】\n${q.desc}\n\n上記の説明に該当する最も適切な用語を選んでください。`;
  
  const optionsDiv = document.getElementById('tq-options');
  optionsDiv.innerHTML = '';
  
  q.options.forEach((opt, idx) => {
    const btn = document.createElement('button');
    btn.className = 'option-btn';
    btn.innerText = opt.term;
    btn.onclick = () => selectTermOption(opt, btn);
    optionsDiv.appendChild(btn);
  });
  
  document.getElementById('tq-action-btn').innerText = "回答する";
  document.getElementById('tq-explanation').style.display = 'none';
}

function selectTermOption(opt, btn) {
  if (tqIsSubmitted) return;
  tqSelectedOption = opt;
  document.querySelectorAll('#tq-options .option-btn').forEach(b => b.classList.remove('selected'));
  btn.classList.add('selected');
}

function submitTermQuizAnswer() {
  const q = termQuestions[tqIdx];
  const btn = document.getElementById('tq-action-btn');
  
  if (!tqIsSubmitted) {
    if (!tqSelectedOption) {
      alert("用語を1つ選択してください。");
      return;
    }
    tqIsSubmitted = true;
    const optionBtns = document.querySelectorAll('#tq-options .option-btn');
    
    q.options.forEach((opt, idx) => {
      if (opt.isCorrect) optionBtns[idx].classList.add('correct-show');
      else if (opt === tqSelectedOption) optionBtns[idx].classList.add('wrong-show');
    });
    
    const expDiv = document.getElementById('tq-explanation');
    expDiv.innerText = tqSelectedOption.isCorrect ? "【正解！】" : `【不正解】 正解は「${q.correctTerm}」です。`;
    expDiv.style.display = 'block';
    
    btn.innerText = (tqIdx < termQuestions.length - 1) ? "次の問題へ" : "最初からやり直す";
  } else {
    if (tqIdx < termQuestions.length - 1) {
      tqIdx++;
      loadTermQuestion();
    } else {
      initTermQuiz();
    }
  }
}

// 初期化実行
initQuiz();
renderTerms();
initTermQuiz();
</script>
