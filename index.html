<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OCI Architect Associate | Ultimate Exam Studio</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Plus Jakarta Sans & Noto Sans JP -->
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', 'Noto Sans JP', sans-serif; }
    /* カスタムスクロールバー */
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: #0f172a; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #475569; }
  </style>
</head>
<body class="bg-[#0b0f19] text-slate-100 min-h-screen flex flex-col antialiased selection:bg-indigo-500 selection:text-white">

  <!-- 🔒 簡易パスワード保護オーバーレイ -->
  <div id="auth-overlay" class="fixed inset-0 bg-[#070a12]/95 backdrop-blur-xl z-50 flex items-center justify-center p-4">
    <div class="bg-slate-900/80 border border-slate-800 p-8 rounded-3xl shadow-2xl shadow-indigo-500/10 max-w-sm w-full text-center space-y-6 relative overflow-hidden">
      <div class="absolute -top-12 -left-12 w-32 h-32 bg-indigo-500/20 rounded-full blur-3xl pointer-events-none"></div>
      <div class="w-16 h-16 bg-gradient-to-tr from-indigo-600 via-violet-600 to-pink-500 rounded-2xl flex items-center justify-center mx-auto text-2xl shadow-lg shadow-indigo-500/30">
        🔐
      </div>
      <div>
        <h2 class="text-xl font-extrabold text-white tracking-tight">OCI Quiz Studio</h2>
        <p class="text-xs text-slate-400 mt-1">パスワードを入力してアクセスを解除</p>
      </div>
      <form onsubmit="event.preventDefault(); checkPassword();" class="space-y-4">
        <input type="password" id="auth-pass" placeholder="Password" class="w-full px-4 py-3 bg-slate-950/80 border border-slate-800 rounded-xl text-sm text-white placeholder-slate-600 focus:outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20 transition duration-200">
        <button type="submit" class="w-full bg-gradient-to-r from-indigo-600 via-violet-600 to-purple-600 hover:opacity-95 text-white font-bold py-3 rounded-xl text-sm transition shadow-lg shadow-indigo-600/30 active:scale-[0.98]">
          Unlock Studio
        </button>
      </form>
      <p id="auth-error" class="text-xs text-rose-400 font-semibold hidden">⚠️ パスワードが正しくありません。</p>
    </div>
  </div>

  <!-- 🚀 ヘッダー -->
  <header class="bg-[#0b0f19]/80 border-b border-slate-800/80 sticky top-0 z-40 backdrop-blur-xl">
    <div class="max-w-5xl mx-auto px-4 py-3.5 flex flex-col sm:flex-row justify-between items-center gap-4">
      <div class="flex items-center gap-3">
        <div class="relative group">
          <div class="absolute -inset-0.5 bg-gradient-to-r from-red-500 via-amber-500 to-indigo-500 rounded-xl blur opacity-60 group-hover:opacity-100 transition duration-300"></div>
          <div class="relative w-10 h-10 bg-slate-900 rounded-xl flex items-center justify-center text-white font-black text-xs border border-slate-800">
            OCI
          </div>
        </div>
        <div>
          <h1 class="text-base font-extrabold tracking-tight bg-clip-text text-transparent bg-gradient-to-r from-white via-slate-200 to-slate-400">
            Architect Associate 対策
          </h1>
          <p class="text-[10px] font-medium text-indigo-400/90 tracking-wider uppercase">Pro Exam Toolkit</p>
        </div>
      </div>

      <!-- ナビゲーションタブ -->
      <nav class="flex bg-slate-900/80 p-1 rounded-2xl border border-slate-800/80 text-xs shadow-inner">
        <button id="tab-quiz-btn" onclick="switchTab('quiz')" class="px-5 py-2 rounded-xl transition-all duration-200 font-bold bg-gradient-to-r from-indigo-600 to-violet-600 text-white shadow-lg shadow-indigo-600/30">
          📝 問題演習
        </button>
        <button id="tab-dict-btn" onclick="switchTab('dict')" class="px-5 py-2 rounded-xl transition-all duration-200 font-semibold text-slate-400 hover:text-slate-200 hover:bg-slate-800/50">
          📖 用語辞書
        </button>
        <button id="tab-termquiz-btn" onclick="switchTab('termquiz')" class="px-5 py-2 rounded-xl transition-all duration-200 font-semibold text-slate-400 hover:text-slate-200 hover:bg-slate-800/50">
          ⚡ 一問一答
        </button>
      </nav>
    </div>
  </header>

  <!-- 💻 メイン領域 -->
  <main class="max-w-5xl mx-auto w-full px-4 py-8 flex-1">

    <!-- ================= 1. 問題演習タブ ================= -->
    <section id="tab-quiz" class="space-y-6">
      
      <!-- 進捗プログレスバー -->
      <div class="w-full bg-slate-900/80 rounded-full h-2 border border-slate-800/80 overflow-hidden">
        <div id="quiz-progress" class="bg-gradient-to-r from-indigo-500 via-purple-500 to-pink-500 h-full w-0 transition-all duration-500 ease-out"></div>
      </div>

      <div class="bg-slate-900/50 border border-slate-800/80 rounded-3xl p-6 sm:p-9 shadow-2xl backdrop-blur-xl relative overflow-hidden">
        <div class="absolute -top-24 -right-24 w-60 h-60 bg-indigo-500/10 rounded-full blur-3xl pointer-events-none"></div>
        <div class="absolute -bottom-24 -left-24 w-60 h-60 bg-purple-500/10 rounded-full blur-3xl pointer-events-none"></div>

        <!-- ヘッダー情報 -->
        <div class="flex justify-between items-center mb-6 pb-4 border-b border-slate-800/80">
          <div class="flex items-center gap-2.5">
            <span id="q-number" class="text-xs font-extrabold text-indigo-400 bg-indigo-500/10 border border-indigo-500/20 px-3.5 py-1.5 rounded-full tracking-wide">
              QUESTION 1 / 15
            </span>
            <span id="q-req-count" class="text-xs font-bold text-amber-400 bg-amber-500/10 border border-amber-500/20 px-3.5 py-1.5 rounded-full">
              1つ選択
            </span>
          </div>
        </div>

        <!-- 問題文 -->
        <p id="q-text" class="text-base sm:text-lg font-semibold text-slate-100 leading-relaxed mb-8 tracking-wide">
          問題文がここに表示されます。
        </p>

        <!-- 選択肢リスト -->
        <div id="options-container" class="space-y-3.5"></div>

        <!-- コントロールボタン -->
        <div class="mt-8 pt-6 border-t border-slate-800/80 flex flex-wrap justify-between items-center gap-4">
          <button id="submit-btn" onclick="checkAnswer()" class="bg-gradient-to-r from-indigo-600 via-violet-600 to-purple-600 hover:opacity-90 text-white font-bold px-8 py-3.5 rounded-2xl shadow-lg shadow-indigo-600/25 transition duration-200 text-sm active:scale-[0.98]">
            回答を送信する
          </button>
          <div class="flex gap-2.5">
            <button id="prev-btn" onclick="prevQuestion()" class="bg-slate-800/80 hover:bg-slate-800 text-slate-300 px-5 py-3 rounded-2xl text-xs font-bold border border-slate-700/50 transition active:scale-[0.97]">
              ← 前へ
            </button>
            <button id="next-btn" onclick="nextQuestion()" class="bg-slate-800/80 hover:bg-slate-800 text-slate-300 px-5 py-3 rounded-2xl text-xs font-bold border border-slate-700/50 transition active:scale-[0.97]">
              次へ →
            </button>
          </div>
        </div>
      </div>

      <!-- 解説カード -->
      <div id="explanation-card" class="hidden bg-slate-900/60 border border-indigo-500/30 rounded-3xl p-6 sm:p-8 shadow-2xl backdrop-blur-xl relative overflow-hidden">
        <div class="flex items-center gap-2.5 text-indigo-400 font-extrabold text-base mb-4">
          <div class="w-8 h-8 bg-indigo-500/20 border border-indigo-500/30 rounded-xl flex items-center justify-center text-lg">💡</div>
          <span>解答・解説</span>
        </div>
        <p id="overall-exp" class="text-sm text-slate-300 leading-relaxed mb-6 bg-slate-950/60 p-4 rounded-2xl border border-slate-800/80 font-medium"></p>
        <div id="option-explanations" class="space-y-3 text-xs border-t border-slate-800/80 pt-5"></div>
      </div>
    </section>

    <!-- ================= 2. 用語一覧タブ ================= -->
    <section id="tab-dict" class="hidden space-y-6">
      <div class="bg-slate-900/50 border border-slate-800/80 rounded-3xl p-6 sm:p-9 shadow-2xl backdrop-blur-xl">
        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-8 pb-4 border-b border-slate-800/80">
          <div>
            <h2 class="text-xl font-extrabold text-white tracking-tight">OCI 専門用語集</h2>
            <p class="text-xs text-slate-400 mt-1">試験に出題される必須キーワードの完全マスターガイド</p>
          </div>
          <div class="relative w-full sm:w-80">
            <input type="text" id="dict-search" oninput="renderDictionary()" placeholder="キーワードで検索..." class="w-full pl-10 pr-4 py-3 bg-slate-950/80 border border-slate-800 rounded-2xl text-xs text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20 transition duration-200">
            <span class="absolute left-3.5 top-3.5 text-slate-500 text-xs">🔍</span>
          </div>
        </div>
        <div id="dict-list" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
      </div>
    </section>

    <!-- ================= 3. 用語クイズタブ ================= -->
    <section id="tab-termquiz" class="hidden space-y-6">
      <div class="bg-slate-900/50 border border-slate-800/80 rounded-3xl p-6 sm:p-9 shadow-2xl backdrop-blur-xl">
        <div class="flex justify-between items-center mb-6 pb-4 border-b border-slate-800/80">
          <span class="text-xs font-extrabold text-indigo-400 bg-indigo-500/10 border border-indigo-500/20 px-3.5 py-1.5 rounded-full tracking-wide">
            SPEED QUIZ
          </span>
          <span class="text-xs text-slate-400 font-medium">該当する正確な説明を選択してください</span>
        </div>
        
        <div class="text-center my-8 bg-slate-950/40 border border-slate-800/60 p-6 rounded-2xl">
          <span class="text-[10px] font-extrabold text-indigo-400 uppercase tracking-widest">Target Term</span>
          <h3 id="term-quiz-title" class="text-2xl sm:text-3xl font-black text-transparent bg-clip-text bg-gradient-to-r from-indigo-300 via-white to-purple-300 mt-1 tracking-tight"></h3>
        </div>

        <div id="term-quiz-options" class="space-y-3.5"></div>

        <div class="mt-8 pt-6 border-t border-slate-800/80 flex justify-between items-center">
          <div id="term-quiz-result" class="text-sm font-bold"></div>
          <button onclick="generateTermQuiz()" class="bg-gradient-to-r from-indigo-600 to-violet-600 hover:opacity-90 text-white text-xs font-bold px-7 py-3 rounded-2xl shadow-lg shadow-indigo-600/25 transition active:scale-[0.98]">
            次の問題へ →
          </button>
        </div>
      </div>
    </section>

  </main>

  <!-- フッター -->
  <footer class="bg-[#070a12] border-t border-slate-800/80 py-5 text-center text-xs text-slate-500 font-medium">
    OCI Architect Associate Certification Practice Studio
  </footer>

  <!-- ⚙️ スクリプト -->
  <script>
    // 🔐 簡易パスワード保護
    const SECRET_PASS = "1219";
    function checkPassword() {
      const inputPass = document.getElementById('auth-pass').value;
      if (inputPass === SECRET_PASS) {
        document.getElementById('auth-overlay').classList.add('hidden');
        sessionStorage.setItem('authenticated', 'true');
      } else {
        document.getElementById('auth-error').classList.remove('hidden');
      }
    }

    // 📚 問題データ (15問)
    const rawQuestions = [
      {
        id: 1, reqCount: 1,
        text: "Auto Scaling 設定で「クールダウン期間」が適用される主な目的として最も適切なものはどれですか？",
        options: [
          { id: "A", text: "スケールイン（縮小）処理のみを一時停止し、データの整合性を保護するため。", exp: "【誤】クールダウンはスケールアウト・スケールインの両方に適用されます。" },
          { id: "B", text: "メトリック収集の頻度を下げ、管理コストを削減するため。", exp: "【誤】メトリック収集頻度の制御ではありません。" },
          { id: "C", text: "前回のスケーリング動作によるメトリックの反映を待ち、過度な連続スケーリングを防ぐため。", exp: "【正】追加したリソースの起動・安定を待たずに再スケーリングされる過剰動作を防ぎます。" },
          { id: "D", text: "ヘルスチェックの失敗検出精度を上げるため。", exp: "【誤】ヘルスチェック間隔の調整とは無関係です。" }
        ],
        correct: ["C"],
        exp: "【総合解説】クールダウン期間はシステムが新しい状態に安定する時間を確保するための待機時間です。"
      },
      {
        id: 2, reqCount: 1,
        text: "ネットワーク・ロードバランサ（NLB）の特徴として正しくないものはどれですか？",
        options: [
          { id: "A", text: "超低遅延で高スループレベルのLayer 4（TCP/UDP/ICMP）処理に対応する。", exp: "【正】NLBの基本特徴です。" },
          { id: "B", text: "クライアントの送信元IPアドレスを保持（Source IP Preservation）できる。", exp: "【正】NLBはL4透過でIPを保持可能です。" },
          { id: "C", text: "SSL/TLSハンドシェイクの終了処理（SSL Offloading）を行うことができる。", exp: "【誤】SSL/TLS終端機能を持つのはLayer 7のフレキシブルLB（ALB）です。" },
          { id: "D", text: "ヘルスチェックが失敗した場合、トラフィックを正常なバックエンドのみに自動ルーティングする。", exp: "【正】一般的なLB機能です。" }
        ],
        correct: ["C"],
        exp: "【総合解説】SSL/TLSターミネーションはLayer 7 Load Balancerの役割であり、Layer 4 NLBでは処理しません。"
      },
      {
        id: 3, reqCount: 1,
        text: "Autonomous Recovery Service (RCV) の説明として誤っているものはどれですか？",
        options: [
          { id: "A", text: "ZDLRA技術に基づき、RPOを1秒未満に抑えるリアルタイム保護を提供する。", exp: "【正】RCVの主要な強みです。" },
          { id: "B", text: "保護ポリシーによって、リカバリ・ウィンドウ（保持期間）を集中管理できる。", exp: "【正】ポリシーベースで自動管理されます。" },
          { id: "C", text: "バックアップデータはすべてお客様のVCN内に直接ファイル形式で露出保管される。", exp: "【誤】管理対象の独立した保護領域に格納され、セキュリティが担保されます。" },
          { id: "D", text: "自動バックアップの暗号化や統合的な健全性チェック機能が含まれている。", exp: "【正】機能に含まれます。" }
        ],
        correct: ["C"],
        exp: "【総合解説】RCVのバックアップ領域はマネージドに分離管理されており、ユーザーのVCN内に露出することはありません。"
      },
      {
        id: 4, reqCount: 1,
        text: "ジオロケーション・ステアリング・ポリシー（DNS）の主な機能はどれですか？",
        options: [
          { id: "A", text: "リクエスト元の地理的ロケーションに基づいて、異なるエンドポイントのIPを返答する。", exp: "【正】地域ごとの最適なエンドポイントに誘導できます。" },
          { id: "B", text: "バックエンドサーバーのCPU使用率に基づいて動的にIPを切り替える。", exp: "【誤】DNSはサーバー負荷率の動的判定を行いません。" },
          { id: "C", text: "特定IPからのDoS攻撃を地理的にブロックする（WAFの機能）。", exp: "【誤】WAFやNSGの役割です。" },
          { id: "D", text: "プライベートVCN内のローカル名前解決を他リージョンへ自動転送する。", exp: "【誤】プライベートDNSリゾルバの役割です。" }
        ],
        correct: ["A"],
        exp: "【総合解説】ジオロケーション・ステアリングはアクセス元の位置情報（国・地域）に応じてDNSレスポンスを変更する機能です。"
      },
      {
        id: 5, reqCount: 1,
        text: "OCIR (OCI Container Registry) へのログイン時、パスワードとして使用すべき認証情報は何ですか？",
        options: [
          { id: "A", text: "OCI コンソールのログインパスワード", exp: "【誤】CLI/Dockerアクセスには使用できません。" },
          { id: "B", text: "API 署名用秘密鍵（PEMフォーマット）", exp: "【誤】Docker CLIでは使用しません。" },
          { id: "C", text: "認証トークン（Auth Token）", exp: "【正】ユーザーごとに発行するAuth Tokenを使用します。" },
          { id: "D", text: "SSH パブリックキー", exp: "【誤】コンピュートへのアクセス用です。" }
        ],
        correct: ["C"],
        exp: "【総合解説】OCIRを含む外部連携ツールからの認証には「Auth Token（認証トークン）」を使用します。"
      },
      {
        id: 6, reqCount: 1,
        text: "Oracle Cloud Migrations (OCM) の説明として適切なものはどれですか？",
        options: [
          { id: "A", text: "オンプレミスVMware環境の資産調査、依存関係分析、OCIインスタンスへの自動移行をサポートする。", exp: "【正】OCMのメイン用途です。" },
          { id: "B", text: "Object Storage内のデータをアーカイブ層へ自動移行するライフサイクルルール。", exp: "【誤】ストレージ側のライフサイクル機能です。" },
          { id: "C", text: "AWSからOCIへのアクティブ・アクティブ型フルリアルタイム双方向同期ツール。", exp: "【誤】アクティブ/アクティブ同期ツールではありません。" },
          { id: "D", text: "MySQLからAutonomous Databaseへのスキーマ変換に限定された軽量ツール。", exp: "【誤】DB限定の変換ツールではありません。" }
        ],
        correct: ["A"],
        exp: "【総合解説】OCMはオンプレミス（特にVMwareなど）からのワークロード移行をエンドツーエンドで自動化・一括管理するサービスです。"
      },
      {
        id: 7, reqCount: 1,
        text: "Monitoring Query Language (MQL) について正しく記述されているものはどれですか？",
        options: [
          { id: "A", text: "SQL標準構文を用いてAutonomous Databaseのデータを検索する言語。", exp: "【誤】メトリック検索用でありDBアクセス用ではありません。" },
          { id: "B", text: "OCI Monitoringでメトリックデータの抽出、集計（sum, meanなど）、アラーム定義を行う専用言語。", exp: "【正】MQLの役割です。" },
          { id: "C", text: "Terraformコードを自動生成するための宣言型記述言語。", exp: "【誤】IaC用言語ではありません。" },
          { id: "D", text: "WAFのカスタムルールを作成するための正規表現言語。", exp: "【誤】WAFルール用ではありません。" }
        ],
        correct: ["B"],
        exp: "【総合解説】MQLはOCIのメトリック（監視データ）を評価・集計・アラート化するための問い合わせ言語です。"
      },
      {
        id: 8, reqCount: 1,
        text: "ZPR（Zero Trust Packet Routing）の特徴・概念として最も正しいものはどれですか？",
        options: [
          { id: "A", text: "IPアドレスやCIDRに基づき、サブネット単位で通信制御を行う。", exp: "【誤】従来のセキュリティ・リスト等の動作です。" },
          { id: "B", text: "ネットワークの物理IP構成に依存せず、意図を表す「セキュリティ属性（タグ）」に基づき通信を強力に制限する。", exp: "【正】ZPRの根本概念（属性ベースアクセス制御）です。" },
          { id: "C", text: "すべての通信をインターネット経由に強制リダイレクトしてWAFで検査する。", exp: "【誤】WAFへのリダイレクト機能ではありません。" },
          { id: "D", text: "暗号化キーをHSMで強制保持するための専用プロトコルである。", exp: "【誤】Vault/HSMの領域です。" }
        ],
        correct: ["B"],
        exp: "【総合解説】ZPRはIPアドレスではなく、リソースに割り当てられた「属性（ZPR tag）」に基づいてアクセス制御を実施します。"
      },
      {
        id: 9, reqCount: 1,
        text: "OCI Cache (インメモリキャッシュ) に関する説明として正しいものはどれですか？",
        options: [
          { id: "A", text: "Apache Cassandra と互換性を持つ完全マネージド型NoSQLデータベースである。", exp: "【誤】Cassandra互換ではありません。" },
          { id: "B", text: "RedisおよびValkeyと互換性があり、超低遅延で高スループットなデータアクセスを実現する。", exp: "【正】OCI Cacheの特長です。" },
          { id: "C", text: "大容量の動画ファイルを低コストで長期保管するためのストレージサービスである。", exp: "【誤】インメモリ技術であり動画アーカイブ用ではありません。" },

    function renderQuestion() {
      const q = rawQuestions[currentIndex];
      
      // プログレスバーの更新
      const progressPercent = ((currentIndex + 1) / rawQuestions.length) * 100;
      document.getElementById('quiz-progress').style.width = `${progressPercent}%`;

      document.getElementById('q-number').innerText = `QUESTION ${currentIndex + 1} / ${rawQuestions.length}`;
      document.getElementById('q-req-count').innerText = `${q.reqCount}つ選択`;
      document.getElementById('q-text').innerText = q.text;

      document.getElementById('prev-btn').disabled = currentIndex === 0;
      document.getElementById('prev-btn').classList.toggle('opacity-30', currentIndex === 0);
      document.getElementById('next-btn').disabled = currentIndex === rawQuestions.length - 1;
      document.getElementById('next-btn').classList.toggle('opacity-30', currentIndex === rawQuestions.length - 1);

      const container = document.getElementById('options-container');
      container.innerHTML = '';

      const currentSelected = selectedAnswers[q.id] || [];
      const isAnswered = answeredState[q.id] || false;

      q.options.forEach(opt => {
        const isChecked = currentSelected.includes(opt.id);
        const optEl = document.createElement('label');
        
        let borderStyle = "border-slate-800/80 bg-slate-950/40 hover:bg-slate-900/80 hover:border-indigo-500/40 hover:-translate-y-0.5 text-slate-300";
        if (isChecked) {
          borderStyle = "border-indigo-500/80 bg-indigo-500/10 text-white font-semibold ring-2 ring-indigo-500/20 shadow-lg shadow-indigo-500/10";
        }

        if (isAnswered) {
          const isCorrectOpt = q.correct.includes(opt.id);
          if (isCorrectOpt) {
            borderStyle = "border-emerald-500 bg-emerald-500/10 text-emerald-200 font-semibold ring-2 ring-emerald-500/20 shadow-lg shadow-emerald-500/10";
          } else if (isChecked && !isCorrectOpt) {
            borderStyle = "border-rose-500 bg-rose-500/10 text-rose-300 ring-2 ring-rose-500/20";
          }
        }

        optEl.className = `flex items-start gap-4 p-4.5 rounded-2xl border text-sm cursor-pointer transition-all duration-200 ${borderStyle}`;
        
        const inputType = q.reqCount === 1 ? 'radio' : 'checkbox';
        optEl.innerHTML = `
          <input type="${inputType}" name="q-option" value="${opt.id}" ${isChecked ? 'checked' : ''} ${isAnswered ? 'disabled' : ''} 
            onchange="toggleOption('${opt.id}')" class="mt-0.5 text-indigo-500 focus:ring-indigo-500/30 rounded border-slate-700 bg-slate-950">
          <span class="flex-1 leading-relaxed"><strong class="mr-2 text-indigo-400 font-bold">${opt.id}.</strong>${opt.text}</span>
        `;
        container.appendChild(optEl);
      });

      const expCard = document.getElementById('explanation-card');
      const submitBtn = document.getElementById('submit-btn');

      if (isAnswered) {
        expCard.classList.remove('hidden');
        submitBtn.innerText = "✓ 回答済み";
        submitBtn.disabled = true;
        submitBtn.className = "bg-slate-800/50 text-slate-500 font-bold px-8 py-3.5 rounded-2xl text-sm cursor-not-allowed border border-slate-800/80";

        document.getElementById('overall-exp').innerText = q.exp;
        const optExpContainer = document.getElementById('option-explanations');
        optExpContainer.innerHTML = '';
        q.options.forEach(opt => {
          const p = document.createElement('p');
          const isCorrect = q.correct.includes(opt.id);
          p.className = isCorrect ? "text-emerald-400 font-medium bg-emerald-500/5 p-2.5 rounded-xl border border-emerald-500/20" : "text-slate-400 p-1";
          p.innerHTML = `<strong class="text-indigo-300">${opt.id}:</strong> ${opt.exp}`;
          optExpContainer.appendChild(p);
        });

      } else {
        expCard.classList.add('hidden');
        submitBtn.innerText = "回答を送信する";
        submitBtn.disabled = false;
        submitBtn.className = "bg-gradient-to-r from-indigo-600 via-violet-600 to-purple-600 hover:opacity-90 text-white font-bold px-8 py-3.5 rounded-2xl shadow-lg shadow-indigo-600/25 transition duration-200 text-sm active:scale-[0.98]";
      }
    }

    function toggleOption(optId) {
      const q = rawQuestions[currentIndex];
      let current = selectedAnswers[q.id] || [];

      if (q.reqCount === 1) {
        current = [optId];
      } else {
        if (current.includes(optId)) {
          current = current.filter(id => id !== optId);
        } else {
          if (current.length < q.reqCount) {
            current.push(optId);
          } else {
            current.shift();
            current.push(optId);
          }
        }
      }
      selectedAnswers[q.id] = current;
      renderQuestion();
    }

    function checkAnswer() {
      const q = rawQuestions[currentIndex];
      const current = selectedAnswers[q.id] || [];

      if (current.length === 0) {
        alert("選択肢を選んでください。");
        return;
      }

      if (current.length !== q.reqCount) {
        alert(`${q.reqCount}個の選択肢を選んでください。`);
        return;
      }

      answeredState[q.id] = true;
      renderQuestion();
    }

    function prevQuestion() {
      if (currentIndex > 0) {
        currentIndex--;
        renderQuestion();
      }
    }

    function nextQuestion() {
      if (currentIndex < rawQuestions.length - 1) {

      }

      filtered.forEach(item => {
        const card = document.createElement('div');
        card.className = "p-5 border border-slate-800/80 rounded-2xl bg-slate-950/40 hover:bg-slate-900/80 hover:border-indigo-500/40 hover:-translate-y-0.5 transition duration-200 space-y-2";
        card.innerHTML = `
          <h4 class="font-extrabold text-indigo-300 text-sm tracking-wide flex items-center gap-2">
            <span class="w-2 h-2 rounded-full bg-indigo-500"></span>
            ${item.term}
          </h4>
          <p class="text-xs text-slate-400 leading-relaxed font-normal">${item.desc}</p>
        `;
        container.appendChild(card);
      });
    }

    let currentTermQuiz = null;

    function generateTermQuiz() {
      document.getElementById('term-quiz-result').innerText = '';
      
      const correctIndex = Math.floor(Math.random() * termDictionary.length);
      const targetTerm = termDictionary[correctIndex];

      let dummyIndices = [];
      while (dummyIndices.length < 3) {
        let rand = Math.floor(Math.random() * termDictionary.length);
        if (rand !== correctIndex && !dummyIndices.includes(rand)) {
          dummyIndices.push(rand);
        }
      }

      let choices = [
        { desc: targetTerm.desc, isCorrect: true },
        ...dummyIndices.map(idx => ({ desc: termDictionary[idx].desc, isCorrect: false }))
      ];
      choices.sort(() => Math.random() - 0.5);

      currentTermQuiz = {
        term: targetTerm.term,
        choices: choices
      };

      document.getElementById('term-quiz-title').innerText = targetTerm.term;
      const optionsContainer = document.getElementById('term-quiz-options');
      optionsContainer.innerHTML = '';

      choices.forEach((choice, i) => {
        const btn = document.createElement('button');
        btn.className = "w-full text-left p-4.5 border border-slate-800/80 rounded-2xl text-xs leading-relaxed hover:border-indigo-500/50 hover:bg-slate-900/80 hover:-translate-y-0.5 transition bg-slate-950/40 text-slate-300";
        btn.innerHTML = `<span class="font-bold mr-2 text-indigo-400 font-mono">[${i + 1}]</span>${choice.desc}`;
        btn.onclick = () => answerTermQuiz(choice.isCorrect, btn);
        optionsContainer.appendChild(btn);
      });
    }

    function answerTermQuiz(isCorrect, btnElement) {
      const resultEl = document.getElementById('term-quiz-result');
      const allButtons = document.getElementById('term-quiz-options').querySelectorAll('button');

      allButtons.forEach(btn => btn.disabled = true);

      if (isCorrect) {
        btnElement.className = "w-full text-left p-4.5 border border-emerald-500 bg-emerald-500/10 text-emerald-200 rounded-2xl text-xs leading-relaxed font-semibold shadow-lg shadow-emerald-500/10";
        resultEl.innerText = "⭕ 正解です！完璧な知識です。";
        resultEl.className = "text-sm font-bold text-emerald-400";
      } else {
        btnElement.className = "w-full text-left p-4.5 border border-rose-500 bg-rose-500/10 text-rose-300 rounded-2xl text-xs leading-relaxed";
        resultEl.innerText = "❌ 残念！不正解です。";
        resultEl.className = "text-sm font-bold text-rose-400";

        currentTermQuiz.choices.forEach((c, idx) => {
          if (c.isCorrect) {
            allButtons[idx].className = "w-full text-left p-4.5 border border-emerald-500 bg-emerald-500/10 text-emerald-200 rounded-2xl text-xs leading-relaxed font-semibold shadow-lg shadow-emerald-500/10";
          }
        });
      }
    }
  </script>
</body>
