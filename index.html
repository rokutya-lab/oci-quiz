<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OCI Architect Associate 対策問題集</title>
  <style>
    :root {
      --bg: #f4f6f9;
      --card: #ffffff;
      --text: #333333;
      --primary: #0076d6;
      --success: #2e7d32;
      --error: #c62828;
      --border: #e0e0e0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 12px;
      display: flex;
      justify-content: center;
    }
    .container {
      width: 100%;
      max-width: 600px;
      background: var(--card);
      border-radius: 12px;
      padding: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      box-sizing: border-box;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      font-size: 14px;
      font-weight: bold;
      color: #666;
    }
    .q-text {
      font-size: 15px;
      line-height: 1.5;
      margin-bottom: 16px;
      white-space: pre-wrap;
    }
    .options {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .option-btn {
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #fff;
      text-align: left;
      font-size: 14px;
      line-height: 1.4;
      cursor: pointer;
      transition: background 0.2s;
    }
    .option-btn:active {
      background: #f0f0f0;
    }
    .option-btn.selected {
      border-color: var(--primary);
      background: #e3f2fd;
    }
    .option-btn.correct-show {
      background: #e8f5e9;
      border-color: var(--success);
      color: var(--success);
      font-weight: bold;
    }
    .option-btn.wrong-show {
      background: #ffebee;
      border-color: var(--error);
      color: var(--error);
    }
    .action-btn {
      width: 100%;
      padding: 14px;
      margin-top: 16px;
      border: none;
      border-radius: 8px;
      background: var(--primary);
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }
    .action-btn:disabled {
      background: #ccc;
    }
    .explanation {
      margin-top: 16px;
      padding: 12px;
      background: #f8f9fa;
      border-left: 4px solid var(--primary);
      border-radius: 4px;
      font-size: 13px;
      line-height: 1.6;
      white-space: pre-wrap;
      display: none;
    }
    .option-exp {
      margin-top: 6px;
      font-size: 12px;
      color: #555;
      background: #fff;
      padding: 8px;
      border-radius: 4px;
      border: 1px dashed #ccc;
      display: none;
    }
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <span id="q-count">問題 1 / 20</span>
    <span id="q-req"></span>
  </div>
  
  <div id="q-text" class="q-text"></div>
  <div id="options" class="options"></div>
  
  <button id="action-btn" class="action-btn" onclick="submitAnswer()">回答する</button>
  <div id="explanation" class="explanation"></div>
</div>

<script>
const MY_PASSWORD = "1219"; // ← 「pass」の部分をご自身の好きなパスワードに変更してください

let inputPass = prompt("パスワードを入力してください:");
if (inputPass !== MY_PASSWORD) {
  alert("パスワードが正しくありません。");
  document.body.innerHTML = "<h2 style='text-align:center; margin-top:50px;'>アクセス権限がありません。</h2>";
  throw new Error("Unauthorized");
}
const rawQuestions = [
  {
    id: 1,
    reqCount: 4,

      { id: "D", text: "モニタリング・サービスで監視できるメトリックとして、ファンクションが消費している CPU やメモリーの量がある。", exp: "【誤】CPUやメモリ消費量のメトリックは直接提供されていません。" },
      { id: "E", text: "サービス・コネクタ・ハブのタスクとしてファンクションを指定し、ログデータを加工できる。", exp: "【正】サービス・コネクタ・ハブのタスクとして呼び出し、ストリーミングデータやログの加工が可能です。" },
      { id: "F", text: "モニタリングのアラーム定義において、アラーム通知の宛先として直接指定できる。", exp: "【誤】通知の宛先にはオンス（Topics）やシカ（PDSなど）を指定します。" },
      { id: "G", text: "リソース・スケジューラを使用して、ファンクションの定期実行を設定できる。", exp: "【正】リソース・スケジューラのターゲットとしてファンクションを指定し、定期実行が可能です。" }
    ],
    correct: ["B", "C", "E", "G"],
    exp: "【総合解説】ファンクションは動的グループとIAMポリシーで他リソースへアクセスでき、モニタリング監視やサービス・コネクタ連携、リソース・スケジューラからの実行に対応しています。"
  },
  {
    id: 2,
    reqCount: 2,
    text: "マルチ AD 構成において、AD3 にだけ新しいインスタンスが作成されませんでした。原因として考えられるものを2つ選んでください。",
    options: [
      { id: "A", text: "ロード・バランサのバックエンド・セットで AD3 が除外されているため。", exp: "【誤】ロードバランサの設定はインスタンスの作成自体には影響しません。" },
      { id: "B", text: "インスタンス・プールの「配置構成」で AD3 が選択されていないため。", exp: "【正】プールの配置構成にAD3が含まれていない場合、AD3にはインスタンスが作成されません。" },
      { id: "C", text: "インスタンス・プールは複数 AD に跨って構成することはできないため。", exp: "【誤】インスタンス・プールは複数ADに跨った構成が可能です。" },
      { id: "D", text: "自動スケーリング・ポリシーの設定で AD3 が明示的に除外されているため。", exp: "【誤】自動スケーリングポリシーでAD単位の除外設定は行いません。" },
      { id: "E", text: "インスタンス・プール構成において AD を複数選択することはできないため。", exp: "【誤】複数選択可能です。" },

let questions = [];
let currentIdx = 0;
let selectedIds = [];
let isSubmitted = false;

function shuffle(array) {
  const arr = [...array];
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function init() {
  questions = shuffle(rawQuestions).map(q => {
    return {
      ...q,
      shuffledOptions: shuffle(q.options)
    };
  });
  currentIdx = 0;
  loadQuestion();
}

function loadQuestion() {
  isSubmitted = false;
  selectedIds = [];
  const q = questions[currentIdx];
  
  document.getElementById('q-count').innerText = `問題 ${currentIdx + 1} / ${questions.length}`;
  document.getElementById('q-req').innerText = `【${q.reqCount}つ選択】`;
  document.getElementById('q-text').innerText = q.text;
  
  const optionsDiv = document.getElementById('options');
  optionsDiv.innerHTML = '';
  
  q.shuffledOptions.forEach((opt, idx) => {
    const wrapper = document.createElement('div');
    wrapper.style.display = 'flex';
    wrapper.style.flexDirection = 'column';
    
    const btn = document.createElement('button');
    btn.className = 'option-btn';
    btn.innerText = opt.text;
    btn.onclick = () => selectOption(opt.id, btn);
    
    const expDiv = document.createElement('div');
    expDiv.className = 'option-exp';
    expDiv.id = `opt-exp-${idx}`;
    expDiv.innerText = opt.exp;
    
    wrapper.appendChild(btn);
    wrapper.appendChild(expDiv);
    optionsDiv.appendChild(wrapper);
  });
  
  document.getElementById('action-btn').innerText = "回答する";
  document.getElementById('action-btn').disabled = false;
  
  const expDiv = document.getElementById('explanation');
  expDiv.style.display = 'none';
  expDiv.innerText = '';
}

function selectOption(id, btn) {
  if (isSubmitted) return;
  const q = questions[currentIdx];
  
  if (q.reqCount === 1) {
    selectedIds = [id];
    document.querySelectorAll('.option-btn').forEach(b => b.classList.remove('selected'));
    btn.classList.add('selected');
  } else {
    if (selectedIds.includes(id)) {
      selectedIds = selectedIds.filter(i => i !== id);
      btn.classList.remove('selected');
    } else {
      if (selectedIds.length < q.reqCount) {
        selectedIds.push(id);
        btn.classList.add('selected');
      }
    }
  }
}

function submitAnswer() {
  const q = questions[currentIdx];
  const btn = document.getElementById('action-btn');
  
  if (!isSubmitted) {
    if (selectedIds.length !== q.reqCount) {
      alert(`${q.reqCount} つの選択肢を選んでください。`);
      return;
    }
    
    isSubmitted = true;
    const optionBtns = document.querySelectorAll('.option-btn');
    
    q.shuffledOptions.forEach((opt, idx) => {
      const isCorrect = q.correct.includes(opt.id);
      const isSelected = selectedIds.includes(opt.id);
      
      if (isCorrect) {
        optionBtns[idx].classList.add('correct-show');
      } else if (isSelected && !isCorrect) {
        optionBtns[idx].classList.add('wrong-show');
      }
      
      // 各選択肢の個別解説を表示
      document.getElementById(`opt-exp-${idx}`).style.display = 'block';
    });
    
    // 全体（総合）解説を表示
    const expDiv = document.getElementById('explanation');
    expDiv.innerText = q.exp;
    expDiv.style.display = 'block';
    
    if (currentIdx < questions.length - 1) {
      btn.innerText = "次の問題へ";
    } else {
      btn.innerText = "最初からやり直す（全シャッフル）";
    }
  } else {
    if (currentIdx < questions.length - 1) {
      currentIdx++;
      loadQuestion();
    } else {
      init();
    }
  }
}
