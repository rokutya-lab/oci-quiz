<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OCI Architect Associate 対策アプリ</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-800 font-sans min-h-screen flex flex-col">

  <!-- ヘッダー -->
  <header class="bg-slate-800 text-white shadow-md">
    <div class="max-w-4xl mx-auto px-4 py-4 flex flex-col sm:flex-row justify-between items-center gap-2">
      <h1 class="text-xl font-bold tracking-wide">OCI Architect Associate 対策</h1>
      <!-- ナビゲーションタブ -->
      <nav class="flex gap-2 bg-slate-700 p-1 rounded-lg text-sm">
        <button id="tab-quiz-btn" onclick="switchTab('quiz')" class="px-4 py-1.5 rounded-md transition font-medium bg-indigo-600 text-white shadow">問題演習</button>
        <button id="tab-dict-btn" onclick="switchTab('dict')" class="px-4 py-1.5 rounded-md transition font-medium text-slate-300 hover:text-white">用語一覧</button>
        <button id="tab-termquiz-btn" onclick="switchTab('termquiz')" class="px-4 py-1.5 rounded-md transition font-medium text-slate-300 hover:text-white">用語クイズ</button>
      </nav>
    </div>
  </header>

  <!-- メインコンテンツ領域 -->
  <main class="max-w-4xl mx-auto w-full px-4 py-6 flex-1">

    <!-- ================= 1. 問題演習タブ ================= -->
    <section id="tab-quiz" class="space-y-6">
      <!-- 問題カード -->
      <div class="bg-white rounded-xl shadow-md p-6 border border-gray-200">
        <div class="flex justify-between items-center mb-4 pb-2 border-b border-gray-100">
          <span id="q-number" class="text-xs font-semibold text-indigo-600 bg-indigo-50 px-2.5 py-1 rounded-full">問題 1 / 15</span>
          <span id="q-req-count" class="text-xs font-medium text-amber-600 bg-amber-50 px-2.5 py-1 rounded-full">1つ選択</span>
        </div>
        <p id="q-text" class="text-base font-medium text-gray-900 leading-relaxed mb-6">問題文がここに表示されます。</p>

        <!-- 選択肢リスト -->
        <div id="options-container" class="space-y-3"></div>

        <!-- アクションエリア -->
        <div class="mt-6 pt-4 border-t border-gray-100 flex flex-wrap justify-between items-center gap-3">
          <button id="submit-btn" onclick="checkAnswer()" class="bg-indigo-600 hover:bg-indigo-700 text-white font-medium px-6 py-2.5 rounded-lg shadow transition">回答する</button>
          <div class="flex gap-2">
            <button id="prev-btn" onclick="prevQuestion()" class="bg-gray-200 hover:bg-gray-300 text-gray-700 px-4 py-2 rounded-lg text-sm transition">前へ</button>
            <button id="next-btn" onclick="nextQuestion()" class="bg-gray-200 hover:bg-gray-300 text-gray-700 px-4 py-2 rounded-lg text-sm transition">次へ</button>
          </div>
        </div>
      </div>

      <!-- 解説表示エリア -->
      <div id="explanation-card" class="hidden bg-slate-50 border border-slate-200 rounded-xl p-6 shadow-inner">
        <h3 class="text-lg font-bold text-slate-800 mb-2 flex items-center gap-2">
          <span>💡</span> 解説
        </h3>
        <p id="overall-exp" class="text-sm text-slate-700 mb-4 leading-relaxed"></p>
        <div id="option-explanations" class="space-y-2 text-sm border-t border-slate-200 pt-3"></div>
      </div>
    </section>

    <!-- ================= 2. 用語一覧タブ ================= -->
    <section id="tab-dict" class="hidden space-y-4">
      <div class="bg-white rounded-xl shadow-md p-6 border border-gray-200">
        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-6">
          <h2 class="text-lg font-bold text-gray-900">専門用語辞書</h2>
          <input type="text" id="dict-search" oninput="renderDictionary()" placeholder="用語や説明文で検索..." class="w-full sm:w-64 px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
        </div>
        <div id="dict-list" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
      </div>
    </section>

    <!-- ================= 3. 用語クイズタブ ================= -->
    <section id="tab-termquiz" class="hidden space-y-6">
      <div class="bg-white rounded-xl shadow-md p-6 border border-gray-200">
        <div class="flex justify-between items-center mb-4 pb-2 border-b border-gray-100">
          <span class="text-xs font-semibold text-indigo-600 bg-indigo-50 px-2.5 py-1 rounded-full">用語一問一答</span>
          <span class="text-xs font-medium text-gray-500">正しい説明を選んでください</span>
        </div>
        <h3 id="term-quiz-title" class="text-xl font-bold text-indigo-900 mb-6"></h3>

        <div id="term-quiz-options" class="space-y-3"></div>

        <div class="mt-6 pt-4 border-t border-gray-100 flex justify-between items-center">
          <div id="term-quiz-result" class="text-sm font-bold"></div>
          <button onclick="generateTermQuiz()" class="bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-medium px-5 py-2 rounded-lg shadow transition">次の用語へ</button>
        </div>
      </div>
    </section>

  </main>

  <!-- フッター -->
  <footer class="bg-white border-t border-gray-200 py-4 text-center text-xs text-gray-500">
    OCI Architect Associate Study Tool
  </footer>

  <!-- アプリケーション・ロジック -->
  <script>
    // --------------------------------------------------
    // 1. 問題データ (15問)
    // --------------------------------------------------
    const rawQuestions = [
      {
        id: 1, reqCount: 1,
        text: "Auto Scaling 設定で「クールダウン期間」が適用される主な目的として最も適切なものはどれですか？",
        options: [
          { id: "A", text: "スケールイン（縮小）処理のみを一時停止し、データの整合性を保護するため。", exp: "【誤】クールダウンはスケールアウト・スケールインの両方に適用されます。" },
          { id: "B", text: "メトリック収集の頻度を下げ、管理コストを削減するため。", exp: "【誤】メトリック収集頻度の制御ではありません。" },
          { id: "C", text: "前回のスケーリング動作によるメトリックの反映を待ち、過度な連続スケーリングを防ぐため。", exp: "【正】追加したリソースの起動・安定を待たずに再スケーリングされる過剰動作を防ぎます。" },
          { id: "D", text: "ヘルスチェックの失敗検出精度を上げるため。", exp: "【误】ヘルスチェック間隔の調整とは無関係です。" }
        ],
        correct: ["C"],
        exp: "【総合解説】クールダウン期間はシステムが新しい状態に安定する時間を確保するための待機時間です。"
      },
      {
        id: 2, reqCount: 1,
        text: "ネットワーク・ロードバランサ（NLB）の特徴として正しくないものはどれですか？",
        options: [
          { id: "A", text: "超低遅延で高スループレベルのLayer 4（TCP/UDP/ICMP）処理に対応する。", exp: "【正】NLBの基本特徴です。" },
          { id: "B", text: "クライアントの送信元IPアドレスを保持（Source IP Preservation）できる。", exp: "【正】NLBはL4透過でIPを保持可能です。" },
          { id: "C", text: "SSL/TLSハンドシェイクの終了処理（SSL Offloading）を行うことができる。", exp: "【誤】SSL/TLS終端機能を持つのはLayer 7のフレキシブルLB（ALB）です。" },
          { id: "D", text: "ヘルスチェックが失敗した場合、トラフィックを正常なバックエンドのみに自動ルーティングする。", exp: "【正】一般的なLB機能です。" }
        ],
        correct: ["C"],
        exp: "【総合解説】SSL/TLSターミネーションはLayer 7 Load Balancerの役割であり、Layer 4 NLBでは処理しません。"
      },
      {
        id: 3, reqCount: 1,
        text: "Autonomous Recovery Service (RCV) の説明として誤っているものはどれですか？",
        options: [
          { id: "A", text: "ZDLRA技術に基づき、RPOを1秒未満に抑えるリアルタイム保護を提供する。", exp: "【正】RCVの主要な強みです。" },
          { id: "B", text: "保護ポリシーによって、リカバリ・ウィンドウ（保持期間）を集中管理できる。", exp: "【正】ポリシーベースで自動管理されます。" },
          { id: "C", text: "バックアップデータはすべてお客様のVCN内に直接ファイル形式で露出保管される。", exp: "【誤】管理対象の独立した保護領域に格納され、セキュリティが担保されます。" },
          { id: "D", text: "自動バックアップの暗号化や統合的な健全性チェック機能が含まれている。", exp: "【正】機能に含まれます。" }
        ],
        correct: ["C"],
        exp: "【総合解説】RCVのバックアップ領域はマネージドに分離管理されており、ユーザーのVCN内に露出することはありません。"
      },
      {
        id: 4, reqCount: 1,
        text: "ジオロケーション・ステアリング・ポリシー（DNS）の主な機能はどれですか？",
        options: [
          { id: "A", text: "リクエスト元の地理的ロケーションに基づいて、異なるエンドポイントのIPを返答する。", exp: "【正】地域ごとの最適なエンドポイントに誘導できます。" },
          { id: "B", text: "バックエンドサーバーのCPU使用率に基づいて動的にIPを切り替える。", exp: "【誤】DNSはサーバー負荷率の動的判定を行いません。" },
          { id: "C", text: "特定IPからのDoS攻撃を地理的にブロックする（WAFの機能）。", exp: "【誤】WAFやNSGの役割です。" },
          { id: "D", text: "プライベートVCN内のローカル名前解決を他リージョンへ自動転送する。", exp: "【誤】プライベートDNSリゾルバの役割です。" }
        ],
        correct: ["A"],
        exp: "【総合解説】ジオロケーション・ステアリングはアクセス元の位置情報（国・地域）に応じてDNSレスポンスを変更する機能です。"
      },
      {
        id: 5, reqCount: 1,
        text: "OCIR (OCI Container Registry) へのログイン時、パスワードとして使用すべき認証情報は何ですか？",
        options: [
          { id: "A", text: "OCI コンソールのログインパスワード", exp: "【誤】CLI/Dockerアクセスには使用できません。" },
          { id: "B", text: "API 署名用秘密鍵（PEMフォーマット）", exp: "【誤】Docker CLIでは使用しません。" },
          { id: "C", text: "認証トークン（Auth Token）", exp: "【正】ユーザーごとに発行するAuth Tokenを使用します。" },
          { id: "D", text: "SSH パブリックキー", exp: "【誤】コンピュートへのアクセス用です。" }
        ],
        correct: ["C"],
        exp: "【総合解説】OCIRを含む外部連携ツールからの認証には「Auth Token（認証トークン）」を使用します。"
      },
      {
        id: 6, reqCount: 1,
        text: "Oracle Cloud Migrations (OCM) の説明として適切なものはどれですか？",
        options: [
          { id: "A", text: "オンプレミスVMware環境の資産調査、依存関係分析、OCIインスタンスへの自動移行をサポートする。", exp: "【正】OCMのメイン用途です。" },
          { id: "B", text: "Object Storage内のデータをアーカイブ層へ自動移行するライフサイクルルール。", exp: "【誤】ストレージ側のライフサイクル機能です。" },
          { id: "C", text: "AWSからOCIへのアクティブ・アクティブ型フルリアルタイム双方向同期ツール。", exp: "【誤】アクティブ/アクティブ同期ツールではありません。" },
          { id: "D", text: "MySQLからAutonomous Databaseへのスキーマ変換に限定された軽量ツール。", exp: "【誤】DB限定の変換ツールではありません。" }
        ],
        correct: ["A"],
        exp: "【総合解説】OCMはオンプレミス（特にVMwareなど）からのワークロード移行をエンドツーエンドで自動化・一括管理するサービスです。"
      },
      {
        id: 7, reqCount: 1,
        text: "Monitoring Query Language (MQL) について正しく記述されているものはどれですか？",
        options: [
          { id: "A", text: "SQL標準構文を用いてAutonomous Databaseのデータを検索する言語。", exp: "【誤】メトリック検索用でありDBアクセス用ではありません。" },
          { id: "B", text: "OCI Monitoringでメトリックデータの抽出、集計（sum, meanなど）、アラーム定義を行う専用言語。", exp: "【正】MQLの役割です。" },
          { id: "C", text: "Terraformコードを自動生成するための宣言型記述言語。", exp: "【誤】IaC用言語ではありません。" },
          { id: "D", text: "WAFのカスタムルールを作成するための正規表現言語。", exp: "【誤】WAFルール用ではありません。" }
        ],
        correct: ["B"],
        exp: "【総合解説】MQLはOCIのメトリック（監視データ）を評価・集計・アラート化するための問い合わせ言語です。"
      },
      {
        id: 8, reqCount: 1,
        text: "ZPR（Zero Trust Packet Routing）の特徴・概念として最も正しいものはどれですか？",
        options: [
          { id: "A", text: "IPアドレスやCIDRに基づき、サブネット単位で通信制御を行う。", exp: "【誤】従来のセキュリティ・リスト等の動作です。" },
          { id: "B", text: "ネットワークの物理IP構成に依存せず、意図を表す「セキュリティ属性（タグ）」に基づき通信を強力に制限する。", exp: "【正】ZPRの根本概念（属性ベースアクセス制御）です。" },
          { id: "C", text: "すべての通信をインターネット経由に強制リダイレクトしてWAFで検査する。", exp: "【誤】WAFへのリダイレクト機能ではありません。" },
          { id: "D", text: "暗号化キーをHSMで強制保持するための専用プロトコルである。", exp: "【誤】Vault/HSMの領域です。" }
        ],
        correct: ["B"],
        exp: "【総合解説】ZPRはIPアドレスではなく、リソースに割り当てられた「属性（ZPR tag）」に基づいてアクセス制御を実施します。"
      },
      {
        id: 9, reqCount: 1,
        text: "OCI Cache (インメモリキャッシュ) に関する説明として正しいものはどれですか？",
        options: [
          { id: "A", text: "Apache Cassandra と互換性を持つ完全マネージド型NoSQLデータベースである。", exp: "【誤】Cassandra互換ではありません。" },
          { id: "B", text: "RedisおよびValkeyと互換性があり、超低遅延で高スループットなデータアクセスを実現する。", exp: "【正】OCI Cacheの特長です。" },
          { id: "C", text: "大容量の動画ファイルを低コストで長期保管するためのストレージサービスである。", exp: "【誤】インメモリ技術であり動画アーカイブ用ではありません。" },
          { id: "D", text: "オンプレミスからOCIへの大容量データ物理転送を行うハードウェア装置である。", exp: "【誤】Data Transfer Applianceの説明です。" }
        ],
        correct: ["B"],
        exp: "【総合解説】OCI CacheはRedis/Valkey互換のインメモリデータストアサービスです。"
      },
      {
        id: 10, reqCount: 1,
        text: "OCI Search with OpenSearch の説明として適切なものはどれですか？",
        options: [
          { id: "A", text: "暗号化キーの鍵管理・輪番処理を行うフルマネージドサービス。", exp: "【誤】OCI Vaultの機能です。" },
          { id: "B", text: "大規模なログ分析やテキスト検索を可能にするフルマネージド型の検索・分析エンジン。", exp: "【正】OpenSearchの機能です。" },
          { id: "C", text: "ドメイン名の登録と権限DNSサーバーの管理に特化した機能。", exp: "【誤】DNSサービスの説明です。" },
          { id: "D", text: "VCN間のすべてのパケットを監視して不正侵入を物理遮断するIDS/IPSエンジン。", exp: "【誤】OpenSearchは検索・分析用途です。" }
        ],
        correct: ["B"],
        exp: "【総合解説】OCI Search with OpenSearchはOpenSearch/OpenSearch Dashboardsを提供する管理型検索エンジンです。"
      },
      {
        id: 11, reqCount: 1,
        text: "ZPR ポリシー「in VCN-Network:DB allow App:App1 endpoints to connect to DB-Server:App1 endpoints with protocol='tcp/1521'」に関する解釈で【誤っているもの】を1つ選んでください。",
        options: [
          { id: "A", text: "コンテキスト条件として VCN-Network:DB を持つVCN内での通信を規定している。", exp: "【正】正しい解釈です。" },
          { id: "B", text: "App:App1 の属性を持つリソースから、DB-Server:App1 の属性を持つリソースへの通信を許可している。", exp: "【正】正しい解釈です。" },
          { id: "C", text: "対象プロトコルおよびポートは 1521/TCP に制限されている。", exp: "【正】正しい解釈です。" },
          { id: "D", text: "このポリシーを適用するには、すべての送信元インスタンスのIPアドレスをポリシー内に個別列挙する必要がある。", exp: "【誤】ZPRはIPアドレスを個別指定せず属性タグで制御します。" }
        ],
        correct: ["D"],
        exp: "【総合解説】ZPRのメリットはIPアドレス依存からの脱却です。IPの個別に指定や管理は不要です。"
      },
      {
        id: 12, reqCount: 1,
        text: "ZPRの文法規則における「ZPR属性（ZPR Attribute）」のフォーマットとして正しいものはどれですか？",
        options: [
          { id: "A", text: "Namespace/Key=Value", exp: "【誤】スラッシュ区切りではありません。" },
          { id: "B", text: "Namespace:Key:Value", exp: "【誤】全コロン区切りではありません。" },
          { id: "C", text: "Namespace.Key:Value（省略時は oracle-zpr ネームスペース）", exp: "【正】ZPR属性の標準構文です。" },
          { id: "D", text: "Key::Value", exp: "【誤】ネームスペースが必要です。" }
        ],
        correct: ["C"],
        exp: "【総合解説】ZPRの属性は `Namespace.Key:Value` 形式で表され、ネームスペース省略時は `oracle-zpr` が補完されます。"
      },
      {
        id: 13, reqCount: 2,
        text: "ネットワーク・ロードバランサ（NLB）とフレキシブル・ロードバランサ（ALB）の比較において、NLBが適しているシナリオを【2つ】選んでください。",
        options: [
          { id: "A", text: "HTTP/2 や WebSocket などのL7アプリケーション層プロトコルに基づく高度なパスルーティングを行いたい場合。", exp: "【誤】L7 ALBの得意領域です。" },
          { id: "B", text: "ミリ秒未満の極めて低いレイテンシと超高スループレベルが要求される UDP トラフィックの処理。", exp: "【正】NLB（L4）が極めて適しています。" },
          { id: "C", text: "クライアントの元のパケットの送信元IPアドレスをバックエンドサーバー側で直接受信・保持したい場合。", exp: "【正】NLBのSource IP Preservation機能が適しています。" },
          { id: "D", text: "SSL Offloading を適用し、バックエンドサーバーの暗号化復号負荷を軽減したい場合。", exp: "【誤】L7 ALBの領域です。" }
        ],
        correct: ["B", "C"],
        exp: "【総合解説】NLBはL4レベルで超低遅延・高スループットを実現し、送信元IPアドレスの保持が可能です。"
      },
      {
        id: 14, reqCount: 3,
        text: "ZPR ポリシー「in VCN-Network:DB allow App:App1 endpoints to connect to DB-Server:App1 endpoints with protocol='tcp/1521'」の正しい解釈を3つ選んでください。",
        options: [
          { id: "A", text: "ネームスペースが明示されていないためポリシーは無効。", exp: "【誤】補完ルールが存在します。" },
          { id: "B", text: "VCN-Network:DB の VCN-Network は属性値を表している。", exp: "【誤】属性（Key）を示します。" },
          { id: "C", text: "App:App1 において、App は属性（Key）であり、App1 はその属性値（Value）である。", exp: "【正】Key:Value の構文ルールに基づきます。" },
          { id: "D", text: "App:App1 の属性を持つリソースから、DB-Server:App1 の属性を持つ DB へ 1521/TCP 接続を許可している。", exp: "【正】指定属性間の通信を許可します。" },
          { id: "E", text: "接続元インスタンスには VCN-Network:DB 属性が付与されている必要がある。", exp: "【誤】VCN-Network:DB はVCNに対するコンテキスト指定であり、インスタンス属性ではありません。" },
          { id: "F", text: "ネームスペースが省略されている場合、デフォルトで oracle-zpr ネームスペースが補完される。", exp: "【正】省略時は oracle-zpr が補完されます。" }
        ],
        correct: ["C", "D", "F"],
        exp: "【総合解説】ZPR（Zero Trust Packet Routing）ポリシーの記述仕様に基づきます。"
      },
      {
        id: 15, reqCount: 2,
        text: "Auto Scaling グループを構築する際に必要な設定コンポーネントを【2つ】選んでください。",
        options: [
          { id: "A", text: "インスタンス構成（Instance Configuration）", exp: "【正】スケーリング時に作成されるインスタンスのひな型（OS、SHAPE、VNIC設定等）を定義します。" },
          { id: "B", text: "インスタンス・プール（Instance Pool）", exp: "【正】同一構成のインスタンス群をグループ化し、Auto Scalingの実行対象とします。" },
          { id: "C", text: "Autonomous Recovery Service (RCV)", exp: "【誤】DB自動バックアップ用サービスです。" },
          { id: "D", text: "ジオロケーション・ステアリング・ポリシー", exp: "【誤】DNSルーティング設定です。" }
        ],
        correct: ["A", "B"],
        exp: "【総合解説】Auto Scalingは「インスタンス構成」からひな型を作り、「インスタンス・プール」に対してスケーリング条件を設定します。"
      }
    ];

    // --------------------------------------------------
    // 2. 専門用語データ (全30用語)
    // --------------------------------------------------
    const termDictionary = [
      // 基本・インフラ構成
      { term: "AD（アベイラビリティ・ドメイン）", desc: "リージョン内に存在する、互いに独立した1つ以上のデータセンター。電源やネットワークが完全に隔離されており、障害耐性を高める配置に使用する。" },
      { term: "FD（障害ドメイン）", desc: "1つのAD内に存在するハードウェアや電源のグループ（各ADに3つ配置）。同一AD内での機器故障の影響を分散させるために利用する。" },
      { term: "VCN（仮想クラウド・ネットワーク）", desc: "OCI上に構築する自分専用のカスタマイズ可能な仮想ネットワーク。サブネット、ルート表、セキュリティ・リストなどで構成される。" },
      { term: "コンパートメント", desc: "OCIのリソースを論理的に整理・隔離するための領域。アクセス制御（IAMポリシー）や課金管理の単位として使用される。" },
      { term: "IAM（Identity and Access Management）", desc: "ユーザー、グループ、動的グループに対して「誰が・どのリソースに・どのような操作を行えるか」をポリシーで制御する認証・認可機能。" },
      { term: "動的グループ（Dynamic Group）", desc: "OCIリソース（コンピュートやFunctionsなど）を自動でまとめるグループ。IAMポリシーを適用することで、リソース自体に他サービスへのアクセス権限を付与できる。" },

      // ネットワーク・ゲートウェイ
      { term: "インターネット・ゲートウェイ（IGW）", desc: "VCNのパブリック・サブネットとインターネットとの間で双方向の通信を可能にするゲートウェイ。" },
      { term: "NAT ゲートウェイ", desc: "プライベート・サブネット内のインスタンスが、インターネット側へ一方通行で通信（アウトバウンド）できるようにするゲートウェイ。" },
      { term: "サービス・ゲートウェイ", desc: "VCN内のプライベート・サブネットから、インターネットを経由せずにOCIの各種サービス（LoggingやObject Storageなど）へ安全にアクセスするための通信口。" },
      { term: "DRG（動的ルーティング・ゲートウェイ）", desc: "VCNと外部ネットワーク（オンプレミス、他リージョンのVCN、Azureなど）を専用線やVPNで相互接続するための仮想ルーター。" },
      { term: "LPG（ローカル・ピアリング・ゲートウェイ）", desc: "同一リージョン内にある2つのVCN同士を、インターネットを経由させずに直接通信させるためのゲートウェイ。" },
      { term: "RPC（リモート・ピアリング・コネクション）", desc: "異なるリージョン間にあるVCN同士を、DRGを介して接続・通信させるためのコンポーネント。" },

      // ストレージ・データベース
      { term: "ブロック・ボリューム", desc: "コンピュート・インスタンスに接続して使用する永続的な高パフォーマンス・ブロック・ストレージ（SANと同等）。VPUで性能を調整可能。" },
      { term: "オブジェクト・ストレージ", desc: "非構造化データ（画像、バックアップ、ログなど）を無制限に保存できる拡張性に優れたストレージ（Standard/Archive/Infrequencyアクセス層がある）。" },
      { term: "ファイル・ストレージ（FSS）", desc: "NFSv3プロトコルをサポートし、複数のコンピュート・インスタンスから同時にマウントして共有できるファイルシステム。" },
      { term: "Autonomous Database（ADB）", desc: "チューニング、パッチ適用、バックアップなどの運用管理がAI・機械学習により完全に自動化された自律型データベース（ATP/ADW）。" },
      { term: "RCV（Autonomous Recovery Service）", desc: "Oracle Database向けの全自動リカバリサービス。ZDLRA技術をベースとし、RPOを1秒未満に抑えるリアルタイム保護を提供する。" },

      // セキュリティ・ガバナンス
      { term: "セキュリティ・リスト", desc: "サブネットレベルで適用される仮想ファイアウォール。インバウンド／アウトバウンドのルールをステートフル／ステートレスで指定する。" },
      { term: "NSG（ネットワーク・セキュリティ・グループ）", desc: "特定のVNIC（仮想NIC）単位で適用できる仮想ファイアウォール。VCN設計を変えずに柔軟なアクセス制御が可能。" },
      { term: "WAF（Web Application Firewall）", desc: "Webアプリケーションの手前に配置し、SQLインジェクションやXSSなどの悪意あるリクエストを検知・遮断するセキュリティ機能。" },
      { term: "OCI Vault", desc: "暗号化キー（マスター・キー）やデータ接続の認証情報（シークレット）を安全に中央管理・保管するサービス。" },
      { term: "ZPR（Zero Trust Packet Routing）", desc: "ネットワークIPアドレスではなく「セキュリティ属性（タグ）」に基づいて通信の許可・不許可を制御するOCIのゼロトラストセキュリティ機能。" },

      // 運用・自動化・その他
      { term: "ジオロケーション・ステアリング", desc: "OCI DNSの機能。アクセス元のユーザーの地理的ロケーションに基づいて、最も近いデータセンターのIPアドレスへ誘導するポリシー。" },
      { term: "認証トークン（Auth Token）", desc: "Docker CLIなどの外部ツールからOCI Container Registry（OCIR）へアクセス・ログインする際にパスワードとして使用する文字列。" },
      { term: "Resource Manager", desc: "TerraformをベースとしたOCIのマネージドサービス。Infrastructure as Code (IaC) によりインフラ構築・変更を自動化する。" },
      { term: "サービス・コネクタ・ハブ", desc: "Loggingなどのソースから、Object StorageやFunctionsなどのターゲットへデータを自動転送・加工・連携するクラウドパイプライン。" },
      { term: "OCI Cache", desc: "RedisおよびValkeyと互換性のあるフルマネージドのインメモリキャッシュサービス。ミリ秒未満の高速レスポンスを実現する。" },
      { term: "OCI Search with OpenSearch", desc: "大規模なログ分析や全文検索を実現するフルマネージド検索エンジン。OpenSearch Dashboardsによる可視化にも対応。" },
      { term: "Oracle Cloud Migrations (OCM)", desc: "オンプレミスのVMware環境などの仮想マシンを分析し、OCI上のコンピュート・インスタンスへ自動移行・変換するサービス。" },
      { term: "MQL（Monitoring Query Language）", desc: "OCI Monitoringでメトリックデータを検索・集計・アラーム定義するために使用する専用のクエリ言語。" }
    ];

    // --------------------------------------------------
    // アプリケーション状態管理
    // --------------------------------------------------
    let currentIndex = 0;
    let selectedAnswers = {}; // { qId: ["A", "B"] }
    let answeredState = {};   // { qId: true/false }

    // --------------------------------------------------
    // 初期化処理
    // --------------------------------------------------
    window.addEventListener('DOMContentLoaded', () => {
      renderQuestion();
      renderDictionary();
      generateTermQuiz();
    });

    // タブ切り替え
    function switchTab(tabName) {
      document.getElementById('tab-quiz').classList.add('hidden');
      document.getElementById('tab-dict').classList.add('hidden');
      document.getElementById('tab-termquiz').classList.add('hidden');

      const btnQuiz = document.getElementById('tab-quiz-btn');
      const btnDict = document.getElementById('tab-dict-btn');
      const btnTermQuiz = document.getElementById('tab-termquiz-btn');

      [btnQuiz, btnDict, btnTermQuiz].forEach(btn => {
        btn.className = "px-4 py-1.5 rounded-md transition font-medium text-slate-300 hover:text-white";
      });

      if (tabName === 'quiz') {
        document.getElementById('tab-quiz').classList.remove('hidden');
        btnQuiz.className = "px-4 py-1.5 rounded-md transition font-medium bg-indigo-600 text-white shadow";
      } else if (tabName === 'dict') {
        document.getElementById('tab-dict').classList.remove('hidden');
        btnDict.className = "px-4 py-1.5 rounded-md transition font-medium bg-indigo-600 text-white shadow";
      } else if (tabName === 'termquiz') {
        document.getElementById('tab-termquiz').classList.remove('hidden');
        btnTermQuiz.className = "px-4 py-1.5 rounded-md transition font-medium bg-indigo-600 text-white shadow";
      }
    }

    // --------------------------------------------------
    // 1. 問題演習ロジック
    // --------------------------------------------------
    function renderQuestion() {
      const q = rawQuestions[currentIndex];
      
      // UI要素の更新
      document.getElementById('q-number').innerText = `問題 ${currentIndex + 1} / ${rawQuestions.length}`;
      document.getElementById('q-req-count').innerText = `${q.reqCount}つ選択`;
      document.getElementById('q-text').innerText = q.text;

      // 前へ・次へボタンの有効化/無効化
      document.getElementById('prev-btn').disabled = currentIndex === 0;
      document.getElementById('prev-btn').classList.toggle('opacity-50', currentIndex === 0);
      document.getElementById('next-btn').disabled = currentIndex === rawQuestions.length - 1;
      document.getElementById('next-btn').classList.toggle('opacity-50', currentIndex === rawQuestions.length - 1);

      // 選択肢の描画
      const container = document.getElementById('options-container');
      container.innerHTML = '';

      const currentSelected = selectedAnswers[q.id] || [];
      const isAnswered = answeredState[q.id] || false;

      q.options.forEach(opt => {
        const isChecked = currentSelected.includes(opt.id);
        const optEl = document.createElement('label');
        
        let borderStyle = "border-gray-200 hover:border-indigo-300 bg-white";
        if (isChecked) {
          borderStyle = "border-indigo-500 bg-indigo-50/50 ring-1 ring-indigo-500";
        }

        // 回答後の色付け
        if (isAnswered) {
          const isCorrectOpt = q.correct.includes(opt.id);
          if (isCorrectOpt) {
            borderStyle = "border-emerald-500 bg-emerald-50 text-emerald-900 font-medium";
          } else if (isChecked && !isCorrectOpt) {
            borderStyle = "border-rose-500 bg-rose-50 text-rose-900";
          }
        }

        optEl.className = `flex items-start gap-3 p-3.5 rounded-lg border text-sm cursor-pointer transition ${borderStyle}`;
        
        const inputType = q.reqCount === 1 ? 'radio' : 'checkbox';
        optEl.innerHTML = `
          <input type="${inputType}" name="q-option" value="${opt.id}" ${isChecked ? 'checked' : ''} ${isAnswered ? 'disabled' : ''} 
            onchange="toggleOption('${opt.id}')" class="mt-0.5 text-indigo-600 focus:ring-indigo-500 rounded">
          <span class="flex-1"><strong class="mr-1">${opt.id}.</strong> ${opt.text}</span>
        `;
        container.appendChild(optEl);
      });

      // 解説カードの制御
      const expCard = document.getElementById('explanation-card');
      const submitBtn = document.getElementById('submit-btn');

      if (isAnswered) {
        expCard.classList.remove('hidden');
        submitBtn.innerText = "回答済み";
        submitBtn.disabled = true;
        submitBtn.className = "bg-gray-400 text-white font-medium px-6 py-2.5 rounded-lg cursor-not-allowed";

        // 解説のセット
        document.getElementById('overall-exp').innerText = q.exp;
        const optExpContainer = document.getElementById('option-explanations');
        optExpContainer.innerHTML = '';
        q.options.forEach(opt => {
          const p = document.createElement('p');
          const isCorrect = q.correct.includes(opt.id);
          p.className = isCorrect ? "text-emerald-700" : "text-gray-600";
          p.innerHTML = `<strong>${opt.id}:</strong> ${opt.exp}`;
          optExpContainer.appendChild(p);
        });

      } else {
        expCard.classList.add('hidden');
        submitBtn.innerText = "回答する";
        submitBtn.disabled = false;
        submitBtn.className = "bg-indigo-600 hover:bg-indigo-700 text-white font-medium px-6 py-2.5 rounded-lg shadow transition";
      }
    }

    function toggleOption(optId) {
      const q = rawQuestions[currentIndex];
      let current = selectedAnswers[q.id] || [];

      if (q.reqCount === 1) {
        current = [optId];
      } else {
        if (current.includes(optId)) {
          current = current.filter(id => id !== optId);
        } else {
          if (current.length < q.reqCount) {
            current.push(optId);
          } else {
            // 上限に達している場合は古い選択を1つ解除して入れ替え
            current.shift();
            current.push(optId);
          }
        }
      }
      selectedAnswers[q.id] = current;
      renderQuestion();
    }

    function checkAnswer() {
      const q = rawQuestions[currentIndex];
      const current = selectedAnswers[q.id] || [];

      if (current.length === 0) {
        alert("選択肢を選んでください。");
        return;
      }

      if (current.length !== q.reqCount) {
        alert(`${q.reqCount}個の選択肢を選んでください。`);
        return;
      }

      answeredState[q.id] = true;
      renderQuestion();
    }

    function prevQuestion() {
      if (currentIndex > 0) {
        currentIndex--;
        renderQuestion();
      }
    }

    function nextQuestion() {
      if (currentIndex < rawQuestions.length - 1) {
        currentIndex++;
        renderQuestion();
      }
    }

    // --------------------------------------------------
    // 2. 用語一覧辞書ロジック
    // --------------------------------------------------
    function renderDictionary() {
      const searchText = document.getElementById('dict-search').value.toLowerCase();
      const container = document.getElementById('dict-list');
      container.innerHTML = '';

      const filtered = termDictionary.filter(item => 
        item.term.toLowerCase().includes(searchText) || 
        item.desc.toLowerCase().includes(searchText)
      );

      if (filtered.length === 0) {
        container.innerHTML = `<p class="text-sm text-gray-500 col-span-2">該当する用語が見つかりませんでした。</p>`;
        return;
      }

      filtered.forEach(item => {
        const card = document.createElement('div');
        card.className = "p-4 border border-gray-100 rounded-lg bg-slate-50/50 hover:bg-slate-50 transition";
        card.innerHTML = `
          <h4 class="font-bold text-indigo-900 text-sm mb-1">${item.term}</h4>
          <p class="text-xs text-gray-600 leading-relaxed">${item.desc}</p>
        `;
        container.appendChild(card);
      });
    }

    // --------------------------------------------------
    // 3. 用語一問一答クイズロジック
    // --------------------------------------------------
    let currentTermQuiz = null;

    function generateTermQuiz() {
      document.getElementById('term-quiz-result').innerText = '';
      
      // 正解となる用語をランダムに選定
      const correctIndex = Math.floor(Math.random() * termDictionary.length);
      const targetTerm = termDictionary[correctIndex];

      // ダミーの選択肢（別用語の説明）を3つ選定
      let dummyIndices = [];
      while (dummyIndices.length < 3) {
        let rand = Math.floor(Math.random() * termDictionary.length);
        if (rand !== correctIndex && !dummyIndices.includes(rand)) {
          dummyIndices.push(rand);
        }
      }

      // 4つの説明文選択肢を作成してシャッフル
      let choices = [
        { desc: targetTerm.desc, isCorrect: true },
        ...dummyIndices.map(idx => ({ desc: termDictionary[idx].desc, isCorrect: false }))
      ];
      choices.sort(() => Math.random() - 0.5);

      currentTermQuiz = {
        term: targetTerm.term,
        choices: choices
      };

      // UI描画
      document.getElementById('term-quiz-title').innerText = targetTerm.term;
      const optionsContainer = document.getElementById('term-quiz-options');
      optionsContainer.innerHTML = '';

      choices.forEach((choice, i) => {
        const btn = document.createElement('button');
        btn.className = "w-full text-left p-3.5 border border-gray-200 rounded-lg text-xs leading-relaxed hover:border-indigo-400 hover:bg-indigo-50/30 transition bg-white";
        btn.innerHTML = `<span class="font-bold mr-1 text-indigo-600">${i + 1}.</span> ${choice.desc}`;
        btn.onclick = () => answerTermQuiz(choice.isCorrect, btn);
        optionsContainer.appendChild(btn);
      });
    }

    function answerTermQuiz(isCorrect, btnElement) {
      const resultEl = document.getElementById('term-quiz-result');
      const allButtons = document.getElementById('term-quiz-options').querySelectorAll('button');

      // 全ボタン無効化
      allButtons.forEach(btn => btn.disabled = true);

      if (isCorrect) {
        btnElement.className = "w-full text-left p-3.5 border border-emerald-500 bg-emerald-50 text-emerald-900 rounded-lg text-xs leading-relaxed font-medium";
        resultEl.innerText = "⭕ 正解です！";
        resultEl.className = "text-sm font-bold text-emerald-600";
      } else {
        btnElement.className = "w-full text-left p-3.5 border border-rose-500 bg-rose-50 text-rose-900 rounded-lg text-xs leading-relaxed";
        resultEl.innerText = "❌ 残念！不正解です。";
        resultEl.className = "text-sm font-bold text-rose-600";

        // 正解の選択肢を緑で表示
        currentTermQuiz.choices.forEach((c, idx) => {
          if (c.isCorrect) {
            allButtons[idx].className = "w-full text-left p-3.5 border border-emerald-500 bg-emerald-50 text-emerald-900 rounded-lg text-xs leading-relaxed font-medium";
          }
        });
      }
    }
  </script>
